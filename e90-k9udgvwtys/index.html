D(54,{t:"香港职场文化",e:"Hong Kong Workplace Culture",
w:"code-switching|中英夹杂;Cantonese|粤语;Mandarin|普通话;local|本地的;expat|外籍人士;hierarchy|等级;formal|正式的;casual|随意的;working hours|工作时间;overtime|加班;lunch hour|午饭时间;annual leave|年假;public holiday|公众假期;culture|文化;noted|收到(邮件常用)",
s:["Shall we grab lunch together?|一起去吃午饭吗？","Let me check and confirm with you.|让我核实后再跟你确认。","Please send me the details by email.|请把详情用电邮发给我。","I'll take annual leave next week.|我下周放年假。","Sorry, I don't speak Cantonese. Can we speak English?|抱歉，我不会说粤语，我们可以说英语吗？","What time do people usually finish work here?|这里的人一般几点下班？"],
g:["港式英语：听得懂，说标准","香港职场邮件、报告以英文为主，口头常中英夹杂（我 check 下 / confirm 咗未）。常见港式用法：revert（回复）、OT（加班）、Noted with thanks（收到，谢谢）、double confirm（再确认）。听懂就好，自己说标准表达会显得更专业。",["Noted with thanks.|收到，谢谢。","Please reply by Friday.|港式常说 Please revert by Friday，意思相同。","I'll confirm again with the client.|港式说 double confirm，标准说法是 confirm again。"]],
c:["A|Hi Shello, are you settling in OK?|嗨 Shello，适应得还好吗？","B|Yes, thanks. But sometimes I don't understand when people mix Cantonese and English.|挺好的，谢谢。不过大家中英夹杂的时候我有时听不懂。","A|Ha, that's very common here. Don't worry, everyone speaks English in meetings.|哈，这在这里很常见。别担心，开会时大家都说英语。","B|That's good to know. And what's the lunch culture like?|那就好。这里的午饭文化是怎样的？","A|Most people go out at 1 p.m. Want to join us today?|大多数人一点出去吃。今天要和我们一起吗？","B|Sure, I'd love to!|好啊，很乐意！"],
k:"练习用英文礼貌说明你不会粤语并转用英文；用 2 分钟比较香港和内地的职场文化（工作时间、沟通方式、午饭）。"});

D(55,{t:"合规与 KYC",e:"Compliance & KYC",
w:"compliance|合规;regulation|监管规定;KYC|了解你的客户;anti-money laundering|反洗钱;due diligence|尽职调查;verify|核实;identity|身份;source of funds|资金来源;suspicious|可疑的;report|举报/报告;risk assessment|风险评估;approve|批准;reject|拒绝;regulator|监管机构;confidential|机密的",
s:["All new clients must be verified.|所有新客户都必须经过核实。","Proof of address must be provided.|必须提供住址证明。","Suspicious transactions should be reported immediately.|可疑交易应立即上报。","Could you explain your source of funds?|您能说明一下资金来源吗？","The application can't be approved without these documents.|没有这些文件，申请无法获批。","This is required by the regulator.|这是监管机构的要求。"],
g:["情态被动：情态动词 + be + 过去分词","must be verified / should be reported / can be approved。这是合规与制度语言最常见的句型，读懂监管文件、内部政策必备。",["Client data must be kept confidential.|客户数据必须保密。","The form should be signed by both parties.|表格应由双方签署。","The account may be closed.|账户可能会被关闭。"]],
c:["A|Before we open the account, we need to do some KYC checks.|开户之前，我们需要做一些 KYC 审核。","B|Sure. What do you need?|好的，需要什么？","A|Your ID and proof of address must be provided. And could you explain your source of funds?|需要提供您的身份证明和住址证明。另外，您能说明资金来源吗？","B|It's mainly my salary and some investment income.|主要是我的工资和一些投资收益。","A|Thank you. All documents must be verified by our compliance team.|谢谢，所有文件都必须由我们的合规团队核实。","B|How long will it take?|需要多久？"],
k:"扮演客户经理，向客户解释为什么需要 KYC、需要哪些文件，至少用 3 个情态被动句，并耐心回答客户的疑问。"});

D(57,{t:"面试：优缺点与 STAR",e:"Interview: Strengths & STAR",
w:"strength|优点;weakness|缺点;achievement|成就;situation|情境;task|任务;action|行动;result|结果;challenge|挑战;improve|改进;overcome|克服;initiative|主动性;leadership|领导力;reliable|可靠的;adaptable|适应力强的;result-oriented|结果导向的",
s:["My greatest strength is my attention to detail.|我最大的优点是注重细节。","One weakness is that I sometimes take on too much.|一个缺点是我有时揽太多工作。","I'm working on improving my public speaking.|我正在提升公开演讲能力。","Let me give you an example.|我举个例子。","As a result, we reduced errors by 30%.|结果，我们把错误率降低了 30%。","I learned a lot from that experience.|我从那次经历中学到很多。"],
g:["STAR 法则回答行为题","Situation（当时情况）→ Task（你的任务）→ Action（你做了什么，主语用 I）→ Result（结果，最好有数字）。说缺点要“真实 + 正在改进”，不要说“我太追求完美”这种套话。",["The situation was that our team was short of staff.|当时的情况是团队人手不足。","My task was to finish the audit in two weeks.|我的任务是两周内完成审计。","As a result, we finished two days early.|结果我们提前两天完成了。"]],
c:["A|What would you say is your greatest strength?|你认为你最大的优点是什么？","B|I'd say I'm very detail-oriented.|我认为我非常注重细节。","A|Can you give me an example?|能举个例子吗？","B|Sure. Last year I found an error in a client report before it was sent.|当然。去年我在一份客户报告发出前发现了一个错误。","B|As a result, we avoided a big compliance issue, and my manager asked me to review all reports.|结果我们避免了一个严重的合规问题，经理还让我审核所有报告。","A|Impressive. And your weakness?|很不错。那你的缺点呢？"],
k:"用 STAR 各准备 1 个答案：最大优点、一个缺点、一次解决问题的经历，每个 1 分半钟，录音。"});

D(58,{t:"面试：行为问题",e:"Interview: Behavioural Questions",
w:"difficult|困难的;conflict|冲突;pressure|压力;handle|应对;calm|冷静的;prioritize|排优先级;solution|解决方案;mistake|错误;learn from|从…中学到;team member|团队成员;successfully|成功地;honest|诚实的;since then|从那以后;in the end|最后;lesson|教训",
s:["Tell me about a time you worked under pressure.|讲讲你在压力下工作的一次经历。","I had never handled such a big client before.|我以前从未服务过这么大的客户。","I stayed calm and prioritized the tasks.|我保持冷静，排好了任务的优先级。","We had already missed one deadline, so I acted quickly.|我们已经错过了一个截止日期，所以我迅速行动。","In the end, we solved the problem together.|最后我们一起解决了问题。","The key lesson I learned was to communicate early.|我学到的关键教训是要尽早沟通。"],
g:["过去完成时 had + 过去分词","表示“过去的过去”，讲故事交代背景时很有用：When I joined, the team had lost two members（我加入时，团队已经走了两个人）。",["By the time I arrived, the meeting had started.|我到的时候，会议已经开始了。","I had never worked with overseas clients before.|我以前从没和海外客户合作过。","We had already finished when the boss called.|老板打电话来时我们已经完成了。"]],
c:["A|Tell me about a time you made a mistake at work.|讲讲你工作中犯错的一次经历。","B|Sure. In my first year, I sent a report with a wrong number.|好的。入职第一年，我发出了一份数字有误的报告。","A|What did you do?|你是怎么做的？","B|I told my manager immediately and sent a corrected version within an hour.|我立即告诉了经理，并在一小时内发出了更正版本。","B|Since then, I've always double-checked numbers before sending.|从那以后，我发送前都会再核对一遍数字。","A|Good. That shows honesty.|很好，这体现了诚实。"],
k:"用 STAR + 过去完成时回答：一次在压力下工作的经历、一次与同事意见不合的经历，每个 2 分钟。"});

D(59,{t:"面试：反问面试官",e:"Interview: Your Questions",
w:"role|职位角色;expectation|期望;training|培训;career path|职业路径;team culture|团队文化;typical day|典型的一天;performance|绩效;evaluate|评估;process|流程;salary|薪资;package|薪酬待遇;benefits|福利;start date|入职日期;success|成功;hear back|收到回复",
s:["Could you tell me more about the team?|能多介绍一下团队吗？","What does a typical day look like in this role?|这个职位典型的一天是怎样的？","What are the biggest challenges for this position?|这个职位最大的挑战是什么？","How is performance evaluated?|绩效是怎么评估的？","What are the next steps in the process?|接下来的流程是什么？","Thank you for your time. I look forward to hearing from you.|谢谢您的时间，期待您的回复。"],
g:["委婉提问","面试结尾的反问体现你的兴趣和专业。用间接或委婉的方式：Could you tell me…? / I was wondering… / May I ask…? 第一轮面试少问薪资，多问培训、团队、挑战和成功标准。",["I was wondering what training is available.|我想了解一下有什么培训。","May I ask what success looks like in this role?|请问这个职位怎样才算做得成功？","When can I expect to hear back?|我大概什么时候能收到回复？"]],
c:["A|Do you have any questions for us?|你有什么问题要问我们吗？","B|Yes, thank you. Could you tell me more about the team I'd be working with?|有的，谢谢。能多介绍一下我将加入的团队吗？","A|Sure. It's a team of eight, mostly relationship managers.|好的，团队八个人，大部分是客户经理。","B|And what are the biggest challenges for this role?|这个职位最大的挑战是什么？","A|Mainly building trust with new clients quickly.|主要是快速与新客户建立信任。","B|Thank you. What are the next steps in the process?|谢谢。接下来的流程是什么？"],
k:"准备 5 个高质量的反问问题，模拟面试结尾的完整对话（提问、回应、致谢、道别）。"});

D(61,{t:"财富管理",e:"Wealth Management",
w:"wealth management|财富管理;asset allocation|资产配置;risk appetite|风险偏好;diversify|分散投资;long-term|长期的;conservative|保守的;aggressive|进取的;balanced|平衡的;retirement|退休;review|检视;rebalance|再平衡;high-net-worth|高净值的;equities|股票类资产;fixed income|固定收益;investment goal|投资目标",
s:["What are your investment goals?|您的投资目标是什么？","How would you describe your risk appetite?|您会怎样描述自己的风险偏好？","I'd recommend a balanced portfolio.|我会建议一个平衡型的投资组合。","It's important to diversify across asset classes.|在不同资产类别之间分散投资很重要。","Let's review your portfolio every six months.|我们每六个月检视一次您的投资组合。","This allocation suits your long-term goals.|这个配置符合您的长期目标。"],
g:["专业建议句型","I'd recommend + 名词 / doing；It might be worth + doing；You may want to consider + doing。不要说 You must buy… —— 合规上要求表达“建议”，而不是“保证”或“命令”。",["I'd recommend keeping 20% in cash.|我建议保留 20% 现金。","It might be worth considering bonds.|也许值得考虑一下债券。","You may want to rebalance your portfolio.|您可能需要再平衡一下投资组合。"]],
c:["A|Thanks for coming in, Mrs. Lau. What are your main financial goals?|刘太太，谢谢您过来。您主要的理财目标是什么？","B|I want to save for my retirement in about 15 years.|我想为大约 15 年后退休做储蓄。","A|And how would you describe your risk appetite?|您会怎样描述自己的风险偏好？","B|I'd say moderate. I don't want to lose too much.|中等吧，我不想亏太多。","A|Then I'd recommend a balanced portfolio, with around 50% bonds and 40% equities.|那我建议一个平衡型组合，约 50% 债券、40% 股票。","B|That sounds reasonable. What about the other 10%?|听起来合理。另外 10% 呢？"],
k:"为保守型、平衡型、进取型三类客户各做 1 分钟资产配置建议，用 I'd recommend / It might be worth / You may want to consider。"});

D(62,{t:"保险",e:"Insurance",
w:"insurance|保险;policy|保单;premium|保费;coverage|保障范围;claim|理赔;beneficiary|受益人;life insurance|人寿保险;medical insurance|医疗保险;savings plan|储蓄计划;critical illness|危疾;payout|赔付;exclusion|除外责任;underwriting|核保;annuity|年金;pre-existing condition|投保前已有的疾病",
s:["The annual premium is 20,000 dollars.|年缴保费是两万元。","This policy covers hospital and surgery costs.|这份保单保障住院和手术费用。","You can make a claim online.|您可以在网上申请理赔。","The coverage continues as long as you pay the premium.|只要您缴纳保费，保障就持续有效。","This isn't covered unless it's an accident.|除非是意外，否则不在保障范围内。","Even if you stop paying, some value remains.|即使停止缴费，仍会保留部分价值。"],
g:["unless / as long as / even if","unless = if not（除非）；as long as = 只要；even if = 即使。保险条款高频句型：Claims are not paid unless… / Coverage continues as long as… / Even if…, the guaranteed amount…",["You won't be covered unless you declare it.|除非您申报，否则不受保障。","As long as you pay on time, the policy stays active.|只要按时缴费，保单就持续有效。","Even if the market falls, the guaranteed amount is protected.|即使市场下跌，保证金额也不受影响。"]],
c:["A|Could you explain what this medical plan covers?|能解释一下这个医疗计划保障什么吗？","B|Sure. It covers hospital stays, surgery and specialist visits.|当然，它保障住院、手术和专科门诊。","A|What about pre-existing conditions?|投保前已有的疾病呢？","B|I'm afraid they're not covered unless you declare them and they're approved.|恐怕除非您申报并获批，否则不在保障范围内。","A|How do I make a claim?|怎么申请理赔？","B|You can submit it online, as long as you have the receipts.|只要有收据，就可以在网上提交。"],
k:"向客户介绍一款保险产品（保障范围、保费、理赔流程、除外条款），用上 unless / as long as / even if，2 分钟。"});

D(64,{t:"证券交易",e:"Securities & Trading",
w:"broker|经纪;order|交易指令;limit order|限价单;market order|市价单;execute|执行;settle|交收;bid|买入价;ask|卖出价;spread|买卖价差;position|持仓;margin|保证金(孖展);stop-loss|止损;liquidity|流动性;trading hours|交易时段;fill|成交",
s:["I'd like to place a limit order.|我想下一个限价单。","Buy 2,000 shares at 35 dollars.|以 35 元买入 2000 股。","The order will be executed as soon as the price reaches 35.|价格一到 35 元，指令就会执行。","Hong Kong stock trades settle in two days.|香港股票交易两天后交收。","The spread is quite wide today.|今天买卖价差比较大。","I'll set a stop-loss at 30.|我会在 30 元设止损。"],
g:["时间状语从句：从句用现在时表将来","when / as soon as / once / until 引导的从句，用一般现在时表示将来，主句用 will：The order will be executed as soon as the price hits 35（不说 will hit）。",["I'll call you when the market opens.|开市时我会打给您。","Once the trade is done, I'll send a confirmation.|交易一完成，我就发确认给您。","Hold the position until it reaches the target.|持仓直到达到目标价。"]],

k:"扮演经纪人接 3 个客户下单（市价单、限价单、止损单），每次都复述确认订单细节（股票、数量、价格、有效期）。"});

D(65,{t:"基金与资产管理",e:"Funds & Asset Management",
w:"fund manager|基金经理;asset management|资产管理;NAV|资产净值;management fee|管理费;performance|表现;benchmark|基准;outperform|跑赢;underperform|跑输;ETF|交易所买卖基金;equity fund|股票基金;bond fund|债券基金;strategy|策略;track record|过往业绩;inflow|资金流入;outflow|资金流出",
s:["The fund outperformed its benchmark last year.|这只基金去年跑赢了基准。","Although returns were lower, risk was reduced.|虽然回报较低，但风险降低了。","Despite the market drop, the fund stayed positive.|尽管市场下跌，基金仍保持正回报。","The management fee is 1.2% per year.|管理费是每年 1.2%。","This ETF tracks the Hang Seng Index.|这只 ETF 追踪恒生指数。","Past performance is not a guarantee of future results.|过往表现不代表未来回报。"],
g:["让步：although / despite","although / even though + 完整句子；despite / in spite of + 名词或 -ing。Although the market fell, the fund rose. = Despite the market fall, the fund rose。注意 despite 后面没有 of。",["Although fees are higher, the track record is strong.|虽然费用较高，但过往业绩很好。","Despite strong inflows, the NAV fell.|尽管资金大量流入，资产净值仍下跌。","Even though it's risky, the returns are attractive.|尽管有风险，回报很有吸引力。"]],
c:["A|How did the fund perform this year?|这只基金今年表现如何？","B|It returned 8%, outperforming its benchmark by 2%.|回报 8%，跑赢基准 2%。","A|Impressive, especially despite the market volatility.|很不错，尤其是在市场波动的情况下。","B|Yes. Although tech stocks fell, our bond holdings helped.|是的，虽然科技股下跌，但我们持有的债券起了作用。","A|What's the management fee?|管理费是多少？","B|It's 1.5% per year, and there's no performance fee.|每年 1.5%，没有业绩表现费。"],
k:"用 1 分钟介绍一只基金（策略、表现、费用、风险提示），至少用 2 个让步句，并以 Past performance is not… 结尾。"});

D(66,{t:"投行与上市",e:"Investment Banking & IPOs",
w:"investment bank|投资银行;IPO|首次公开招股;listing|上市;underwriter|承销商;prospectus|招股书;valuation|估值;merger|合并;acquisition|收购;M&A|并购;roadshow|路演;pricing|定价;oversubscribed|超额认购;sponsor|保荐人;retail investor|散户投资者;institutional investor|机构投资者",
s:["The IPO was oversubscribed 50 times.|这次招股获超额认购 50 倍。","The company plans to list in Hong Kong next year.|公司计划明年在香港上市。","We're the sole sponsor for this deal.|我们是这项交易的独家保荐人。","The valuation is around 10 billion US dollars.|估值约为一百亿美元。","The acquisition was completed in May.|收购在五月完成。","The roadshow starts next Monday.|路演下周一开始。"],

D(67,{t:"财务报表",e:"Financial Statements",
w:"income statement|利润表;balance sheet|资产负债表;cash flow statement|现金流量表;revenue|收入;cost|成本;gross profit|毛利;net profit|净利润;margin|利润率;assets|资产;liabilities|负债;equity|股东权益;earnings per share|每股收益;debt|债务;annual report|年报;audit|审计",
s:["Revenue was up 12% year-on-year.|收入同比增长 12%。","Net profit fell to 1.8 billion dollars.|净利润降至 18 亿元。","The gross margin improved to 35%.|毛利率提升至 35%。","Total assets reached 50 billion.|总资产达到 500 亿。","Debt levels remain manageable.|负债水平仍然可控。","The company has strong cash flow.|公司现金流强劲。"],
g:["财报比较句型","X was up / down Y% year-on-year；X rose / fell from A to B；X improved / declined to Y%；compared with last year…。英文汇报习惯先说结论（涨还是跌），再给数字。",["Compared with 2025, costs rose by 5%.|与 2025 年相比，成本上升了 5%。","Earnings per share increased from 2.1 to 2.4 dollars.|每股收益从 2.1 元增至 2.4 元。","The margin declined slightly to 18%.|利润率小幅下降至 18%。"]],
c:["A|Could you summarize the annual results?|能总结一下年度业绩吗？","B|Sure. Revenue was up 10% year-on-year to 25 billion dollars.|好的，收入同比增长 10%，达到 250 亿元。","A|And profit?|利润呢？","B|Net profit rose 6%, but the margin fell slightly because of higher costs.|净利润增长 6%，但由于成本上升，利润率略有下降。","A|How's the balance sheet?|资产负债表情况如何？","B|It's healthy. Debt went down and cash increased.|很健康，负债下降，现金增加。"],
k:"用 1 分钟“汇报”一家虚构公司的年度业绩（收入、利润、利润率、负债、一句话结论）。"});

D(68,{t:"风险管理",e:"Risk Management",
w:"credit risk|信用风险;market risk|市场风险;liquidity risk|流动性风险;operational risk|操作风险;exposure|风险敞口;mitigate|缓解;hedge|对冲;stress test|压力测试;limit|限额;default|违约;tend to|往往;potential|潜在的;scenario|情景;appear to|似乎;to some extent|在某种程度上",
s:["Our exposure to real estate is quite high.|我们对房地产的风险敞口相当高。","We need to mitigate this risk.|我们需要缓解这个风险。","We can hedge the currency risk with forwards.|我们可以用远期合约对冲汇率风险。","The stress test shows potential losses of 5%.|压力测试显示潜在损失为 5%。","Rising rates tend to hurt bond prices.|利率上升往往会打压债券价格。","There's a possibility of default.|存在违约的可能。"],
g:["留余地的表达（hedging language）","tend to, appear to, seem to, it is likely that, there is a possibility that, to some extent。金融人说话专业的标志，是“准确地表达不确定”。",["It appears that demand is slowing.|需求似乎在放缓。","To some extent, the risk is manageable.|在某种程度上，风险是可控的。","Small caps tend to be more volatile.|小盘股往往波动更大。"]],
c:["A|What are the main risks in our portfolio?|我们投资组合的主要风险是什么？","B|Our biggest exposure is to property bonds.|我们最大的风险敞口是房地产债券。","A|How serious is it?|有多严重？","B|The stress test suggests we could lose up to 8% in a bad scenario.|压力测试显示，在不利情景下我们可能损失高达 8%。","A|What can we do?|我们能做什么？","B|We could reduce our position gradually and hedge part of it.|我们可以逐步减仓，并对冲一部分。"],
k:"作为风险经理，用 2 分钟向主管汇报一个风险（是什么、多大、可能后果、缓解措施），至少用 3 个留余地的表达。"});

D(69,{t:"宏观经济与政策",e:"The Economy & Policy",
w:"economy|经济;GDP|国内生产总值;inflation|通货膨胀;interest rate|利率;central bank|中央银行;recession|经济衰退;growth|增长;unemployment|失业;stimulus|刺激措施;currency|货币;exchange rate|汇率;peg|挂钩;HIBOR|香港银行同业拆息;lead to|导致;due to|由于",
s:["Inflation is falling, so rates may come down.|通胀在下降，所以利率可能会下调。","The Hong Kong dollar is pegged to the US dollar.|港元与美元挂钩。","Because of the peg, Hong Kong rates follow US rates.|由于联系汇率，香港利率跟随美国利率。","Weak demand led to slower growth.|需求疲弱导致增长放缓。","The stimulus resulted in a strong recovery.|刺激措施带来了强劲复苏。","Due to high rates, property prices fell.|由于利率高企，楼价下跌。"],
g:["因果表达","because / since / as + 句子；because of / due to + 名词；lead to / result in（导致）；as a result / therefore（因此）。香港实行联系汇率制度：港元挂钩美元，所以香港利率基本跟随美国。",["High inflation led to rate hikes.|高通胀导致加息。","Due to the peg, HIBOR follows US rates.|由于联系汇率，HIBOR 跟随美国利率。","As a result, mortgage costs went up.|因此，按揭成本上升了。"]],
c:["A|Why are mortgage rates in Hong Kong so high?|香港的按揭利率为什么这么高？","B|Mainly because of the US rate hikes.|主要是因为美国加息。","A|But why do US rates affect Hong Kong?|但美国利率为什么会影响香港？","B|Because the Hong Kong dollar is pegged to the US dollar, so HIBOR tends to follow US rates.|因为港元与美元挂钩，所以 HIBOR 往往跟随美国利率。","A|I see. So if the Fed cuts rates…|明白了，所以如果美联储减息……","B|Then Hong Kong rates will likely come down too.|那香港利率很可能也会下降。"],
k:"用“原因 → 结果”链条解释：美联储加息如何影响香港楼市和股市，至少用 4 个因果连接词，2 分钟。"});

D(71,{t:"金融科技与数字银行",e:"Fintech & Digital Banking",
w:"fintech|金融科技;digital bank|数字银行;virtual bank|虚拟银行;mobile app|手机应用;payment|支付;e-wallet|电子钱包;Faster Payment System|转数快;blockchain|区块链;artificial intelligence|人工智能;automation|自动化;cybersecurity|网络安全;data|数据;innovation|创新;user experience|用户体验;licensed|持牌的",
s:["Most clients now open accounts online.|现在大多数客户都在网上开户。","You can transfer money instantly with FPS.|用转数快可以即时转账。","It is AI that is changing the industry fastest.|正是人工智能在最快地改变这个行业。","Cybersecurity is our top priority.|网络安全是我们的首要任务。","Virtual banks often offer higher deposit rates.|虚拟银行往往提供更高的存款利率。","The app has a great user experience.|这个应用的用户体验很好。"],
g:["强调句 It is / was … that …","It is / was + 被强调部分 + that / who…：It is customer trust that matters most（最重要的正是客户信任）。在演讲和汇报中用来突出重点。",["It was the new app that attracted young clients.|正是新应用吸引了年轻客户。","It's data that drives our decisions.|驱动我们决策的正是数据。","It is security that clients care about most.|客户最关心的正是安全。"]],
c:["A|Do you use a virtual bank?|你用虚拟银行吗？","B|Yes, I opened an account in ten minutes on my phone.|用，我在手机上十分钟就开了户。","A|That's fast! Is it safe?|真快！安全吗？","B|They're licensed by the HKMA, so I think it's quite safe.|它们由金管局发牌，所以我觉得挺安全的。","A|What do you like most?|你最喜欢哪一点？","B|It's the user experience that I like most. Everything is simple.|我最喜欢的是用户体验，一切都很简单。"],
k:"讨论“金融科技对传统银行的影响”2 分钟，至少用 1 个强调句和 1 条完整的因果链。"});

D(72,{t:"市场评论",e:"Market Commentary",
w:"commentary|评论;outlook|展望;forecast|预测;project|预计;estimate|估计;sentiment|市场情绪;rally|反弹上涨;sell-off|抛售;correction|回调;consensus|市场共识;upside|上行空间;downside|下行风险;catalyst|催化剂;cautious|谨慎的;valuation|估值",
s:["We expect the market to remain volatile.|我们预计市场将保持波动。","Analysts forecast 5% earnings growth.|分析师预测盈利增长 5%。","Market sentiment has improved.|市场情绪有所改善。","Tech stocks rallied after the results.|业绩公布后科技股上涨。","We remain cautious on property.|我们对地产股保持谨慎。","The key catalyst will be the rate decision.|关键催化剂将是利率决议。"],
g:["预测与观点表达","expect / forecast / project + 名词 + to do；be expected to do；We remain + 形容词（cautious / positive）+ on + 行业。市场评论结构：发生了什么 → 原因 → 展望 → 建议。",["Growth is expected to slow next year.|预计明年增长将放缓。","We see more upside in banks.|我们认为银行股有更大上行空间。","The consensus is for two rate cuts.|市场共识是减息两次。"]],
c:["A|What's your view on the market this week?|你对本周市场怎么看？","B|Sentiment has improved after the strong US data.|美国数据强劲后，市场情绪有所改善。","A|Do you expect the rally to continue?|你预计升势会持续吗？","B|In the short term, yes. But we remain cautious because valuations are high.|短期内会，但由于估值偏高，我们保持谨慎。","A|Any sectors you like?|有看好的板块吗？","B|We see upside in Hong Kong banks, as they benefit from high rates.|我们看好香港银行股，因为它们受益于高利率。"],
k:"录一段 1 分半钟的“今日市场点评”：发生了什么 → 原因 → 展望 → 建议。可以参考当天的真实英文财经新闻。"});

D(73,{t:"客户会议：总结与确认",e:"Client Meetings: Confirming",
w:"summarize|总结;confirm|确认;clarify|澄清;so what you're saying is|所以你的意思是;correct me if I'm wrong|如有不对请指正;in other words|换句话说;priority|优先事项;concern|顾虑;requirement|要求;agree on|就…达成一致;timeline|时间表;proposal|方案;just to confirm|再确认一下;make sure|确保;income|收入",
s:["So what you're saying is that you want lower risk.|所以您的意思是想要更低的风险。","Correct me if I'm wrong, but your priority is income.|如有不对请指正，您的首要目标是收益。","Just to clarify, is the budget 2 million?|澄清一下，预算是两百万吗？","Let me summarize what we've agreed.|让我总结一下我们达成的共识。","I'll send you a proposal by Thursday.|我会在星期四前把方案发给您。","Is there anything else you'd like to discuss?|还有其他想讨论的吗？"],
g:["主动确认理解","专业沟通的核心：复述（So you mean…）→ 确认（Is that right?）→ 总结（To summarize…）→ 下一步（I'll… by…）。非母语者尤其要多用，既避免误解，也显得专业可靠。",["Let me make sure I've got this right.|让我确认一下我理解得对不对。","In other words, you want stable returns.|换句话说，您想要稳定的回报。","Just to confirm, the meeting is on Monday.|再确认一下，会议在星期一。"]],
c:["A|So, Mr. Tang, what are your main concerns?|邓先生，您主要的顾虑是什么？","B|I'm worried about market volatility. I need stable income for my family.|我担心市场波动，我需要为家人提供稳定收入。","A|So what you're saying is that income and safety are your top priorities. Is that right?|所以您的意思是收益和安全是首要目标，对吗？","B|Exactly.|完全正确。","A|Then let me summarize: we'll focus on bonds and dividend stocks, with low risk. I'll send you a proposal by Thursday.|那我总结一下：我们会专注于债券和高息股，低风险。我星期四前把方案发给您。","B|Perfect, thank you.|很好，谢谢。"],
k:"模拟一场 10 分钟客户会议：了解需求 → 复述确认 → 总结 → 约定下一步。全程录音，回放时数一数你用了几次确认句。"});

D(74,{t:"交叉销售",e:"Cross-selling",
w:"cross-sell|交叉销售;open question|开放式问题;closed question|封闭式问题;benefit|好处;package|组合;upgrade|升级;promotion|优惠;interested|感兴趣的;consider|考虑;protect|保护;plan ahead|提前规划;education fund|教育基金;situation|情况;pressure|压力;peace of mind|安心",
s:["May I ask what your plans are for your children's education?|请问您对孩子的教育有什么规划？","Have you thought about protecting your family?|您考虑过为家人提供保障吗？","Many clients in your situation choose a savings plan.|很多和您情况类似的客户会选择储蓄计划。","Would you be interested in hearing more?|您有兴趣多了解一下吗？","There's no pressure. Take your time to think.|没有压力，您慢慢考虑。","It gives you peace of mind.|它能让您安心。"],
g:["开放式与封闭式问题","开放式问题（What / How / Why）用来挖掘需求；封闭式问题（Do / Would / Are）用来确认意向。顺序：问需求 → 共鸣 → 方案 → 好处 → 邀请。合规底线：不夸大、不保证收益。",["What are your goals for the next five years?|您未来五年的目标是什么？","How do you plan for retirement?|您怎样规划退休？","Would you like me to send you some information?|需要我发一些资料给您吗？"]],
c:["A|Mrs. Wong, may I ask about your plans for your son's education?|黄太太，请问您对儿子的教育有什么规划？","B|We hope he can study overseas in about ten years.|我们希望他大约十年后能出国读书。","A|That's a great goal. Have you started saving for it?|这是很好的目标。您开始为此储蓄了吗？","B|Not really, just in my savings account.|还没有，只是放在储蓄账户里。","A|Many parents in your situation use an education savings plan. Would you be interested in hearing more?|很多和您情况类似的家长会用教育储蓄计划。您有兴趣了解一下吗？","B|Sure, tell me more.|好啊，说来听听。"],
k:"按“开放问题 → 挖掘需求 → 推荐 → 好处 → 邀请”的流程完成 2 次交叉销售模拟（教育基金、退休规划）。"});

D(75,{t:"电话会议",e:"Conference Calls",
w:"conference call|电话会议;join|加入;mute|静音;unmute|取消静音;share screen|共享屏幕;connection|网络连接;break up|声音断断续续;echo|回音;interrupt|打断;go ahead|请说;jump in|插话;catch|听清;on the same page|想法一致;time zone|时区;dial in|拨入",
s:["Can everyone hear me?|大家都听得到我吗？","Sorry, you're breaking up.|抱歉，你的声音断断续续的。","You're on mute.|你开着静音。","Sorry to interrupt, but could I add something?|抱歉打断一下，我可以补充一点吗？","Could you go back to the previous slide?|能回到上一张幻灯片吗？","Let's make sure we're all on the same page.|我们确认一下大家的理解一致。"],
g:["电话会议生存技巧","打断前先道歉：Sorry to interrupt… / Can I just jump in here?；没听清直接问：Sorry, I didn't catch the last part；轮到你发言先报名字：This is Shello. I'd like to add…。在线会议看不到表情，所以要比面对面更多地确认。",["Sorry, I didn't catch that.|抱歉，我没听清。","Go ahead, please.|请说。","Can I just jump in here?|我能插一句吗？"]],
c:["A|Hi everyone, can you all hear me?|大家好，都听得到我吗？","B|Yes, loud and clear.|听得到，很清楚。","C|Sorry, John, you're breaking up a bit.|抱歉 John，你的声音有点断断续续。","A|Is that better now?|现在好点了吗？","B|Sorry to interrupt, but could you share your screen?|抱歉打断，你能共享一下屏幕吗？","A|Sure, give me one second.|当然，稍等一下。"],
k:"模拟一次多人电话会议，依次练习：确认声音、打断、请求重复、补充意见、总结共识。"});

D(76,{t:"向上汇报：结论先行",e:"Reporting Up: Bottom Line First",
w:"bottom line|核心结论;in short|简而言之;key takeaway|关键要点;recommendation|建议;decision|决定;approval|批准;impact|影响;option|方案;pros and cons|利弊;escalate|上报;heads-up|提前提醒;FYI|供参考;quick update|简短汇报;long-term value|长期价值;discount|折扣",
s:["The bottom line is we're on budget.|核心结论是我们在预算之内。","In short, the deal is delayed by two weeks.|简而言之，交易推迟两周。","I have a quick update on the client.|我有个关于客户的简短汇报。","There are two options. I recommend option A.|有两个方案，我建议方案 A。","Just a heads-up, the client may complain.|提前提醒一下，客户可能会投诉。","I need your approval by tomorrow.|我需要您明天前批准。"],
g:["结论先行（BLUF）","BLUF = Bottom Line Up Front：先说结论或请求，再给原因和细节。中文习惯“背景 → 过程 → 结论”，英文汇报要倒过来：结论 → 原因（2-3 点）→ 下一步或请求。",["The short answer is yes.|简短的回答是：可以。","My recommendation is to wait.|我的建议是等一等。","Let me give you the key points first.|我先说要点。"]],
c:["A|Hi boss, do you have two minutes for a quick update?|老板，有两分钟听个简短汇报吗？","B|Sure, go ahead.|好，你说。","A|In short, the client wants to move 5 million to us, but they need a lower fee.|简而言之，客户想转五百万过来，但需要更低的费用。","A|I see two options: keep the fee and maybe lose the deal, or offer 0.2% off. I recommend the discount.|我看有两个方案：维持费用、可能失去这笔生意，或者减 0.2%。我建议给折扣。","B|Why?|为什么？","A|Because the long-term value is much higher than the fee cut.|因为长期价值远高于减掉的费用。"],
k:"把一段“中文式”汇报（背景先行）改写为“结论先行”版本，用 30 秒讲完 3 个事项，录音对比。"});

D(78,{t:"说服技巧",e:"Persuasion",
w:"persuade|说服;convince|使相信;argument|论点;evidence|证据;value|价值;proven|经过验证的;imagine|想象;advantage|优势;compelling|令人信服的;win-win|双赢;hassle|麻烦事;paperwork|文书工作;dedicated|专属的;most importantly|最重要的是;speak for themselves|不言自明",
s:["Let me show you why this makes sense.|让我说明为什么这样做是合理的。","Imagine having a steady income after retirement.|想象一下退休后有稳定的收入。","The numbers speak for themselves.|数据说明一切。","There are three reasons why this is a good choice.|这是个好选择，有三个理由。","This is a win-win solution.|这是一个双赢的方案。","What would it take to get your approval?|需要怎样才能得到您的批准？"],
g:["说服三要素与三点法","亚里士多德说服三要素：Logos 逻辑（数据、证据）、Ethos 可信度（经验、资质）、Pathos 情感（共鸣）。三点法：There are three reasons… First… Second… Most importantly…，听众最容易记住。",["First, it's low cost. Second, it's flexible. Most importantly, it's safe.|第一，成本低；第二，灵活；最重要的是，安全。","Based on the data, this option is clearly better.|根据数据，这个方案明显更好。","I've helped over 100 clients with similar needs.|我帮助过一百多位有类似需求的客户。"]],
c:["A|I'm not sure about moving my money to your bank.|我不确定要不要把钱转到你们银行。","B|I understand. Let me give you three reasons to consider us.|我理解。让我给您三个考虑我们的理由。","B|First, our fees are 30% lower. Second, you'll have a dedicated relationship manager. Most importantly, we have a strong track record in Asia.|第一，我们的费用低 30%；第二，您会有专属客户经理；最重要的是，我们在亚洲有很好的过往业绩。","A|That sounds good, but switching is a hassle.|听起来不错，但转过来很麻烦。","B|Don't worry, we'll handle all the paperwork for you.|别担心，所有文书工作我们都会帮您处理。","A|OK, let's talk details.|好吧，我们谈谈细节。"],
k:"用“三点法 + 数据 + 情感”说服“客户”把资产转到你的银行，2 分钟，并处理 1 个反对意见。"});

D(79,{t:"艰难对话",e:"Difficult Conversations",
w:"unfortunately|不幸的是;disappointing|令人失望的;loss|亏损;transparent|透明的;responsibility|责任;reassure|安抚;recover|恢复;patience|耐心;realistic|现实的;regret|遗憾;tough|艰难的;move forward|向前推进;sell-off|抛售;misunderstanding|误会;adjust|调整",
s:["I'm afraid I have some disappointing news.|恐怕我有一些令人失望的消息。","Unfortunately, the portfolio lost 8% this quarter.|很遗憾，投资组合本季度亏损了 8%。","I want to be completely transparent with you.|我想对您完全透明。","I understand this is frustrating.|我理解这让人很沮丧。","Let's look at the options to move forward.|我们来看看接下来有哪些选择。","Thank you for your patience.|谢谢您的耐心。"],
g:["软化语言与坏消息结构","软化语言：I'm afraid… / Unfortunately… / It seems that… / We might need to…。传达坏消息的结构：预告（I have some news）→ 事实（直接说清楚，不绕弯）→ 共情 → 方案。",["It seems there's been a misunderstanding.|似乎有些误会。","I'm afraid we can't approve the loan.|恐怕我们无法批准这笔贷款。","We might need to adjust the plan.|我们可能需要调整计划。"]],
c:["A|Mr. Lee, thanks for meeting me. I'm afraid I have some disappointing news.|李先生，谢谢您抽空见面。恐怕我有一些令人失望的消息。","B|What happened?|发生什么事了？","A|Unfortunately, your portfolio lost 8% this quarter, mainly because of the tech sell-off.|很遗憾，您的投资组合本季度亏损了 8%，主要是因为科技股遭抛售。","B|That's a lot. I'm not happy.|亏得不少，我很不满意。","A|I completely understand. I want to be transparent and show you exactly what happened, and our plan to move forward.|我完全理解。我想坦诚地给您看清楚发生了什么，以及我们接下来的计划。","B|OK, let's hear it.|好吧，说来听听。"],
k:"练习传达 3 个坏消息（投资亏损、贷款被拒、项目延期），每个都按“预告 → 事实 → 共情 → 方案”的结构。"});

D(80,{t:"ESG 与可持续金融",e:"ESG & Sustainable Finance",
w:"ESG|环境、社会及管治;sustainable|可持续的;green bond|绿色债券;climate change|气候变化;carbon emissions|碳排放;net zero|净零排放;renewable energy|可再生能源;governance|公司治理;disclosure|信息披露;impact investing|影响力投资;greenwashing|漂绿;transition|转型;rating|评级;stakeholder|利益相关方;committed to|致力于",
s:["More investors are looking at ESG factors.|越来越多投资者关注 ESG 因素。","Hong Kong is a major hub for green bonds.|香港是绿色债券的重要中心。","The company aims to reach net zero by 2050.|公司目标是在 2050 年前实现净零排放。","ESG disclosure is becoming mandatory.|ESG 信息披露正逐渐成为强制要求。","We need to avoid greenwashing.|我们需要避免漂绿。","Good governance reduces long-term risk.|良好的公司治理能降低长期风险。"],
g:["目标与趋势表达","aim to do / be committed to doing / be on track to do / be becoming increasingly + 形容词。ESG 是香港金融的热门话题，面试中经常被问到。注意 committed to 后面接 doing。",["The bank is committed to reducing emissions.|银行致力于减少排放。","ESG is becoming increasingly important.|ESG 正变得越来越重要。","We aim to double our green financing.|我们的目标是让绿色融资翻倍。"]],
c:["A|Do clients really care about ESG?|客户真的在意 ESG 吗？","B|More and more, especially younger and institutional investors.|越来越在意，尤其是年轻投资者和机构投资者。","A|What products do we offer?|我们提供哪些产品？","B|We have green bonds and ESG funds. Hong Kong is one of the biggest green bond markets in Asia.|我们有绿色债券和 ESG 基金。香港是亚洲最大的绿色债券市场之一。","A|How do we avoid greenwashing?|我们怎样避免漂绿？","B|By checking third-party ratings and the company's disclosure carefully.|仔细核对第三方评级和公司的信息披露。"],
k:"用 PREP 结构回答面试题：What do you think about ESG investing? 1 分半钟。"});

D(81,{t:"香港金融体系与监管",e:"Hong Kong's Financial System",
w:"SFC|证监会;HKMA|金管局;Insurance Authority|保险业监管局;MPF|强积金;HKEX|香港交易所;licence|牌照(英式名词);licensed|持牌的;regulated activity|受规管活动;responsible officer|负责人员;CPD|持续专业培训;licensing exam|牌照考试;registered|已注册的;Stock Connect|股票互联互通;Greater Bay Area|大湾区;cross-border|跨境的",
s:["You need to be licensed to advise on securities.|就证券提供意见需要持牌。","Banks in Hong Kong are regulated by the HKMA.|香港的银行由金管局监管。","I'm preparing for the licensing exam.|我在准备牌照考试。","Stock Connect links Hong Kong and mainland markets.|股票互联互通连接了香港和内地市场。","Every employee has an MPF account.|每个雇员都有强积金账户。","Licensed staff must complete CPD hours every year.|持牌人员每年必须完成持续专业培训时数。"],
g:["缩写的读法与冠词","大部分缩写逐个字母读：S-F-C，H-K-M-A，M-P-F，C-P-D。冠词看发音而不是拼写：S 读 /es/ 以元音开头，所以说 an SFC licence、an MPF account。香港官方用英式拼写：licence（名词）/ license（动词）。",["She holds Type 1 and Type 4 licences.|她持有第 1 类和第 4 类牌照。","HKEX is one of the world's largest exchanges.|港交所是全球最大的交易所之一。","The Insurance Authority regulates insurers.|保监局监管保险公司。"]],
c:["A|What do I need to work as an investment adviser in Hong Kong?|在香港做投资顾问需要什么？","B|You'll usually need to be licensed for Type 1 and Type 4 regulated activities.|通常需要持有第 1 类和第 4 类受规管活动的牌照。","A|Is there an exam?|要考试吗？","B|Yes, you need to pass the licensing exams first. At a bank, you register through the HKMA.|要，你得先通过牌照考试。如果在银行，就通过金管局注册。","A|And for insurance?|那保险呢？","B|That's regulated by the Insurance Authority. It's a separate licence.|那由保险业监管局监管，是另一个牌照。"],
k:"用英文介绍香港金融监管体系（SFC / HKMA / IA / MPFA 各管什么）以及你计划考的牌照，1 分半钟。"});

D(82,{t:"电梯演讲",e:"The Elevator Pitch",
w:"pitch|推介;elevator pitch|电梯演讲;concise|简洁的;unique|独特的;value proposition|价值主张;specialize in|专注于;passionate|充满热情的;differentiate|区别于;memorable|令人难忘的;hook|吸引点;call to action|行动号召;bilingual|双语的;cross-border|跨境的;open to|愿意接受;grab a coffee|喝杯咖啡",
s:["I help clients grow and protect their wealth.|我帮助客户增长和保护财富。","I specialize in cross-border wealth planning.|我专注于跨境财富规划。","What makes me different is my bilingual background.|我的不同之处在于双语背景。","I bring both mainland and international experience.|我同时拥有内地和国际经验。","I'd love to grab a coffee and learn more about your work.|很想约你喝杯咖啡，多了解你的工作。","Here's my card.|这是我的名片。"],
g:["30 秒电梯演讲公式","我是谁（I'm…）→ 我帮谁解决什么问题（I help… to…）→ 证据或差异（Recently I… / What makes me different…）→ 行动号召（Could we…?）。用短句，一句话只讲一件事。",["I'm a wealth planner. I help mainland families invest in Hong Kong.|我是财富规划师，帮助内地家庭在香港投资。","Last year I helped 30 families plan their education funds.|去年我帮助 30 个家庭规划了教育基金。","Would you be open to a quick chat next week?|下周方便简单聊聊吗？"]],
c:["A|So, what do you do?|那你是做什么的？","B|I'm a wealth planner. I help mainland families manage their assets in Hong Kong.|我是财富规划师，帮助内地家庭在香港管理资产。","A|Interesting. Why Hong Kong?|有意思，为什么是香港？","B|Because many families want international diversification, and I understand both markets.|因为很多家庭想做国际化分散投资，而我了解两边的市场。","B|Actually, would you be open to a quick coffee next week? I'd love to hear about your work too.|对了，下周方便喝杯咖啡吗？我也很想听听你的工作。","A|Sure, why not?|好啊，有何不可？"],
k:"写出你自己的 30 秒电梯演讲，背熟后计时录音，确保不超过 30 秒、不卡顿。"});

D(83,{t:"模拟面试（一）",e:"Mock Interview 1",
w:"motivation|动机;research|研究;values|价值观;fit|匹配;contribute|贡献;commitment|投入;learning curve|学习曲线;growth|成长;ambition|抱负;passion|热情;attract|吸引;presence|业务覆盖;from day one|从第一天起;fast learner|学得快的人;in five years|五年后",
s:["I've always been passionate about financial markets.|我一直对金融市场充满热情。","I've done some research on your company.|我对贵公司做过一些研究。","Your focus on Greater Bay Area clients matches my background.|贵公司对大湾区客户的重视与我的背景很匹配。","In five years, I see myself leading a client team.|五年后，我希望能带领一个客户团队。","I'm confident I can contribute from day one.|我有信心从第一天起就能做出贡献。","I'm a fast learner and I adapt quickly.|我学得快，适应能力强。"],
g:["面试经典三问的框架","Why finance?（经历触发 → 能力匹配 → 热情）；Why us?（研究过公司 → 与你的匹配点 → 你能贡献什么）；Where do you see yourself in five years?（成长 → 贡献 → 与公司共同发展）。",["What attracted me to this role is the client-facing work.|吸引我的是这个职位需要直接面对客户。","I believe my skills are a good fit.|我相信我的技能很匹配。","I'm looking for a long-term career here.|我希望在这里长期发展。"]],
c:["A|Why do you want to work in finance?|你为什么想做金融？","B|I've always been interested in how money moves the world. In my first job, I loved helping clients plan their investments.|我一直对资金如何推动世界很感兴趣。在第一份工作中，我很喜欢帮客户规划投资。","A|And why our company?|那为什么选择我们公司？","B|I've researched your firm. Your strong presence in the Greater Bay Area matches my background and language skills.|我研究过贵公司。贵公司在大湾区的强大业务与我的背景和语言能力很匹配。","A|Where do you see yourself in five years?|五年后你希望自己在哪里？","B|I'd like to be a senior relationship manager, leading a team and growing with the company.|我希望成为高级客户经理，带领团队，与公司共同成长。"],
k:"完整模拟一面：自我介绍 + Why finance + Why us + 五年规划 + 优缺点，连续录音 10 分钟，回放后按“技巧 → 口语自评清单”打分。"});

D(85,{t:"模拟客户推介",e:"Mock Client Pitch",
w:"needs analysis|需求分析;solution|解决方案;fee structure|收费结构;risk disclosure|风险披露;objection|异议;address|处理(问题);close|成交;onboarding|开户流程;walk through|逐步讲解;high-grade|高评级的;target|目标;honesty|诚实;go ahead|开始进行;partnership|合作关系;appreciate|感谢",
s:["Thank you for your time today.|感谢您今天抽出时间。","Based on what you told me, here's my proposal.|根据您告诉我的情况，这是我的方案。","Let me walk you through the fee structure.|让我为您逐项讲解收费结构。","I must also explain the key risks.|我也必须说明主要风险。","I understand your concern. Let me address it.|我理解您的顾虑，让我来解答。","Shall we start the onboarding process?|我们开始办理开户手续吧？"],
g:["Feel - Felt - Found 处理异议","I understand how you feel（我理解您的感受）→ Many clients felt the same way（很多客户也有同感）→ But they found…（但他们后来发现…）。推介完整流程：寒暄 → 回顾需求 → 方案 → 好处与数据 → 风险披露（合规必需）→ 处理异议 → 邀约成交。",["I understand how you feel. Many clients felt the same way, but they found the plan very flexible.|我理解您的感受，很多客户也这么觉得，但他们后来发现这个计划很灵活。","Let me walk you through the numbers.|让我带您看一下数字。","Is there anything stopping us from moving forward?|还有什么让我们不能推进的吗？"]],
c:["A|Based on our last meeting, your main goal is stable income. Is that still right?|根据上次会面，您的主要目标是稳定收益，现在还是这样吗？","B|Yes.|是的。","A|Then I propose a portfolio of high-grade bonds and dividend funds, targeting around 4 to 5% per year.|那我建议一个由高评级债券和高息基金组成的组合，目标年回报约 4% 至 5%。","B|What are the risks?|有什么风险？","A|Returns aren't guaranteed. Bond prices can fall if rates rise, and there's some currency risk.|回报不保证。利率上升时债券价格可能下跌，也有一定的汇率风险。","B|OK, I appreciate your honesty. Let's go ahead.|好，感谢您的坦诚，我们开始吧。"],
k:"完整演练一次 15 分钟客户推介（包含风险披露和 1 次异议处理），录音后按清单自评。"});

D(86,{t:"模拟会议",e:"Mock Meeting",
w:"chair|主持;facilitate|引导;consensus|共识;vote|表决;show of hands|举手表决;park|暂时搁置;circle back|回头再谈;take offline|会后单独讨论;align|对齐想法;stakeholder|利益相关方;deliverable|交付成果;owner|负责人;run out of time|时间不够;agreed|同意;onboarding process|开户流程",
s:["Let's park this and come back to it later.|我们先把这个搁置，稍后再谈。","Can we circle back to the budget issue?|我们能回到预算问题吗？","Do we have consensus on this?|我们在这一点上达成共识了吗？","Who will own this action item?|谁来负责这个待办事项？","I think we're aligned on the main points.|我认为我们在主要问题上意见一致。","We're running out of time, so let's wrap up.|时间快不够了，我们收尾吧。"],
g:["高阶会议用语","park / table an issue（搁置 / 提出议题）、circle back（回头再谈）、take this offline（会后单独谈）、be aligned（意见一致）、own an action item（负责某项任务）。这些是国际金融机构会议中的高频表达。",["Let's take this offline.|我们会后单独讨论。","Can I get a quick show of hands?|可以举手表决一下吗？","I'll own this one.|这个我来负责。"]],
c:["A|Let's move to item three: the new client onboarding process.|我们进入第三项：新客户开户流程。","B|I think it's too slow. It takes two weeks on average.|我认为太慢了，平均要两周。","C|I agree, but compliance needs time for checks.|我同意，但合规部需要时间审核。","A|Good points. Let's take the details offline. Can we agree to aim for one week?|说得都对。细节会后再谈，我们能否同意以一周为目标？","B|Agreed. I'll own the action item and work with compliance.|同意，这项任务我来负责，并与合规部合作。","A|Great. The deadline is the end of next month.|很好，截止日期是下个月底。"],
k:"主持一场 15 分钟模拟会议（3 个议题），练习：引导发言、搁置争议、达成共识、分配任务。"});

D(87,{t:"商务午餐与闲聊",e:"Business Lunch & Small Talk",
w:"business lunch|商务午餐;recommend|推荐;dish|菜;treat|请客;split the bill|分摊账单;my treat|我请客;cheers|干杯;toast|祝酒;relax|放松;topic|话题;avoid|避免;dim sum|点心;by the way|顺便说一下;discover|发现;move|搬家",
s:["Have you been to this restaurant before?|您以前来过这家餐厅吗？","I'd recommend the roast goose. It's famous here.|我推荐烧鹅，这里很有名。","This one's on me.|这顿我请。","How long have you been in Hong Kong?|您来香港多久了？","Any travel plans for the holidays?|假期有旅行计划吗？","It was great having lunch with you.|和您一起吃午饭很愉快。"],
g:["Answer + Add + Ask 对话延续法","回答问题 + 补充一点信息 + 反问对方，对话就不会冷场。安全话题：美食、旅行、运动、城市、电影；避免话题：政治、宗教、收入、年龄。",["Do you like Hong Kong? I love it, especially the food. What about you?|喜欢香港吗？很喜欢，尤其是美食。您呢？","That sounds amazing!|听起来太棒了！","Oh really? Tell me more.|真的吗？多说说。"]],
c:["A|Have you tried dim sum here before?|您以前在这里吃过点心吗？","B|Not at this restaurant. What do you recommend?|这家没吃过，您推荐什么？","A|The har gow and char siu bao are excellent.|虾饺和叉烧包非常好。","B|Great, let's order those. By the way, how long have you lived in Hong Kong?|好，就点这些。顺便问一下，您在香港住了多久？","A|About ten years. I moved here from London. How about you?|大约十年，我从伦敦搬过来的。您呢？","B|Just a few months. I'm still discovering the city!|才几个月，我还在探索这座城市！"],
k:"用 Answer + Add + Ask 法则完成 10 轮闲聊问答；模拟一次与客户的商务午餐（点菜 → 闲聊 → 买单 → 道别）。"});

D(88,{t:"地道习语",e:"Idioms & Natural Expressions",
w:"on the same page|想法一致;ballpark figure|大概的数字;touch base|联系一下;get the ball rolling|开始行动;think outside the box|跳出框框思考;up in the air|悬而未决;back to square one|回到原点;cut corners|偷工减料;in a nutshell|简而言之;keep me posted|随时告诉我进展;on top of it|一切在掌控中;call it a day|今天到此为止;the ball is in your court|该你决定了;a win-win|双赢;the bottom line|关键所在",

{id:"start",t:"使用说明与 90 天目标",h:`
<p>这套程序为“零基础、每天 8 小时、目标在香港金融行业工作、以口语为重点”的你设计。90 天分三个阶段，每 7 天安排 1 个复习日，第 30、60、90 天是阶段测试。</p>
<h4>每天怎么用</h4>
<ol>
<li>打开 <b>今日</b>：按时间表从上到下完成 7 个学习块，完成一块就勾选一块。</li>
<li>每个单词、句子、对话都可以点 🔊 听原音；点 <b>慢</b> 用慢速听。</li>
<li>口语练习时点 <b>🎙 跟读</b>：程序会识别你说的话并打分（需要浏览器支持）；不支持时会改为录音，录完回放和原音对比。</li>
<li>晚上到 <b>练习</b> 页做闪卡复习和听写，程序会按记忆曲线自动安排复习。</li>
<li>每天结束点 <b>完成今天</b>，进入下一天。</li>
</ol>
<h4>现实目标</h4>
<p>90 天 × 8 小时 = 720 小时，这是非常高强度的投入。坚持下来，多数零基础学习者可以达到：能流畅地做自我介绍和面试回答、处理日常职场沟通（会议、电话、邮件）、用英文和客户进行基础金融对话，大约相当于欧洲语言框架 B1 水平，口语在熟悉的金融话题上会更好。要像本地同事一样自如地处理复杂谈判，通常还需要 6-12 个月的实战积累。所以把这 90 天当作“打通口语”的阶段，而不是终点。</p>
<h4>最重要的三条原则</h4>
<ul>
<li><b>每天开口至少 3 小时。</b>只听不说，永远学不会说。</li>
<li><b>每天录音。</b>录音是你最诚实的老师，第 2 天和第 90 天的录音对比，会是你最大的动力。</li>
<li><b>不追求完美，追求被听懂。</b>语法有小错没关系，先说出来，再慢慢修正。</li>
</ul>`},

{id:"thinking",t:"英文逻辑思维技巧",h:`
<p>很多人学了很多单词仍然说不出来，原因往往不是词汇量，而是还在用中文的逻辑组织英文。下面 8 个思维转换，是从“翻译式英语”走向“英文思维”的关键。</p>
<h4>1. 结论先行，不要先铺垫</h4>
<p>中文习惯“背景 → 过程 → 结论”，英文（尤其商务英文）习惯“结论 → 理由 → 细节”。</p>
<p>中文式：<i>Because the market was volatile and the client was worried and we had a meeting yesterday… so I think we should wait.</i><br>英文式：<i class="say">I think we should wait. The main reason is that the market is volatile.</i></p>
<h4>2. 先找主语和动词</h4>
<p>英文句子必须有“谁 + 做什么”。开口前先问自己：主语是谁？动作是什么？</p>
<p>“下雨了” → <i class="say">It's raining.</i>　“有人找你” → <i class="say">Someone is looking for you.</i>　“开会时间改了” → <i class="say">The meeting time has changed.</i></p>
<h4>3. 头轻脚重：修饰语放后面</h4>
<p>中文把长修饰放在名词前（“昨天给我打电话的那个香港客户”），英文先说核心名词，再往后补充：</p>
<p><i class="say">the client from Hong Kong who called me yesterday</i></p>
<p>说话时先把最重要的词说出来，其余信息像挂件一样往后挂，就不会卡住。</p>
<h4>4. 用连接词把逻辑“写”出来</h4>
<p>中文重意合，逻辑靠语境；英文重形合，逻辑必须用词表达出来：because、so、but、however、therefore、for example、as a result。每句话之间问自己：它们是什么关系？然后选对连接词。</p>
<h4>5. PREP 结构：英文表达的万能骨架</h4>
<p><b>P</b>oint 观点 → <b>R</b>eason 理由 → <b>E</b>xample 例子 → <b>P</b>oint 重申观点</p>
<p><i class="say">I think Hong Kong is a great place for a finance career. The main reason is that it's an international hub. For example, most global banks have their Asian headquarters here. So, overall, it's the best place to grow.</i></p>
<h4>6. 三点法</h4>
<p>英文听众喜欢“三”：<i class="say">There are three reasons. First… Second… And most importantly…</i> 说之前先在脑子里列 3 个点，再开口，表达会立刻显得有条理。</p>
<h4>7. 具体胜于笼统</h4>
<p>英文商务沟通重视具体数字和事实。不要说 <i>Our sales are very good</i>，要说 <i class="say">Our sales grew by 12 percent this quarter.</i></p>
<h4>8. 用英文直接思考的练习</h4>
<ul>
<li><b>自言自语：</b>走路、坐港铁时，用英文描述你看到的东西和正在做的事。</li>
<li><b>英英理解：</b>记单词时尝试用简单英文解释它：<i class="say">A broker is a person who buys and sells shares for clients.</i></li>
<li><b>语块思维：</b>不要一个词一个词拼，而是整块调用：<i class="say">I'm afraid…</i>、<i class="say">Could you…?</i>、<i class="say">The main reason is…</i></li>
<li><b>不会就绕：</b>想不起某个词，用简单的词描述它，而不是停下来查中文。</li>
</ul>`},

{id:"method",t:"英文学习方法",h:`
<h4>1. 影子跟读（Shadowing）—— 练口语最有效的方法</h4>
<ol>
<li>先听一遍原音，看懂意思。</li>
<li>看着文本，跟着原音同步读（慢速）。</li>
<li>不看文本，原音一出你就跟（延迟半秒）。</li>
<li>模仿语调、重音、停顿，甚至语气。</li>
<li>录下自己的声音，和原音对比，找出 1-2 个差距再练。</li>
</ol>
<p>每天 1 小时影子跟读，坚持 30 天，你的发音和语感会有质的变化。</p>
<h4>2. 间隔重复：按记忆曲线复习</h4>
<p>新学的单词如果不复习，一周后会忘掉大半。最高效的复习时间点是：学完当天、第 1 天、第 2 天、第 4 天、第 7 天、第 15 天、第 30 天。本程序的“闪卡复习”已经按这个节奏自动安排，你只需要每天把“今日到期”刷完。</p>
<h4>3. 主动回忆，而不是反复看</h4>
<p>看 10 遍不如想 1 遍。复习时先遮住中文，自己说出意思，再翻开核对；读对话时先遮住英文，看中文说英文。</p>
<h4>4. 学语块，不学孤立单词</h4>
<p>记 <i class="say">make a decision</i> 而不是 decision；记 <i class="say">open an account</i> 而不是 account。口语里调用的是整块语言，语块越多，说得越流利。</p>
<h4>5. 精听 + 泛听</h4>
<ul>
<li><b>精听</b>（每天 1 小时）：短材料反复听，直到每个词都听清；配合听写，找出听不出的原因（连读？生词？语速？）。</li>
<li><b>泛听</b>（碎片时间）：通勤、吃饭时听英文播客或新闻，不求全懂，只为习惯语速和语感。</li>
</ul>
<h4>6. 输出驱动：每天录音、每天写</h4>
<p>每天睡前录 2 分钟独白（今天学了什么 / 今天发生了什么），再写 5 句英文日记。输出会逼你发现“我以为我会，其实不会”的地方。</p>
<h4>7. 8 小时不是硬撑：番茄节奏</h4>
<p>每学 50 分钟休息 10 分钟，每 2 小时起身活动。午饭后小睡 20 分钟。高强度学习最大的敌人是疲劳，而不是时间。</p>
<h4>8. 打造英语环境</h4>
<ul>
<li>手机、电脑系统语言改成英文。</li>
<li>用英文搜索信息，看英文财经新闻。</li>
<li>每周至少 2-3 次和真人说英语：在线外教、语言交换、行业活动都可以。</li>
<li>在香港生活中，点餐、问路、购物坚持用英文。</li>
</ul>
<h4>9. 避开这些坑</h4>
<ul>
<li>只背单词书，不练句子和对话。</li>
<li>等“准备好了”再开口 —— 永远不会准备好。</li>
<li>每句话都先在脑子里翻译成中文。</li>
<li>只看不听、只听不说、只说不录。</li>
</ul>`},

{id:"natural",t:"英文自然表达技巧",h:`
<h4>1. 口语一定要用缩写</h4>
<p><i class="say">I'm, you're, it's, don't, can't, I'll, I'd, we've</i> —— 不用缩写会听起来像在念课文。</p>
<h4>2. 多用短语动词</h4>
<p>母语者口语里大量使用短语动词，比书面词更自然：</p>
<ul>
<li>investigate → <i class="say">look into</i></li>
<li>continue → <i class="say">carry on</i></li>
<li>contact later → <i class="say">follow up</i>, <i class="say">get back to you</i></li>
<li>arrange → <i class="say">set up a meeting</i></li>
<li>find out → <i class="say">figure out</i></li>
</ul>
<h4>3. 搭配比单词更重要</h4>
<p><i class="say">make a decision</i>（不说 do a decision）、<i class="say">strong demand</i>、<i class="say">heavy traffic</i>、<i class="say">take a risk</i>、<i class="say">raise interest rates</i>、<i class="say">place an order</i>。遇到新词，顺手记下它的常用搭配。</p>
<h4>4. 委婉礼貌是专业的标志</h4>
<ul>
<li>I want… → <i class="say">I'd like…</i></li>
<li>You are wrong. → <i class="say">I see it a bit differently.</i></li>
<li>Do it now. → <i class="say">Could you do this when you have a moment?</i></li>
<li>No. → <i class="say">I'm afraid that won't be possible.</i></li>
<li>Your idea is bad. → <i class="say">That's an interesting idea. Have we considered…?</i></li>
</ul>
<h4>5. 少用 very，用更准确的词</h4>
<p>very big → <i class="say">huge</i>　very good → <i class="say">excellent</i>　very tired → <i class="say">exhausted</i>　very important → <i class="say">crucial</i>　very busy → <i class="say">swamped</i></p>
<h4>6. 常见中式英语纠正</h4>
<table>
<tr><th>中式说法</th><th>地道说法</th></tr>
<tr><td>I very like it.</td><td><i class="say">I really like it.</i></td></tr>
<tr><td>Open the light.</td><td><i class="say">Turn on the light.</i></td></tr>
<tr><td>I am agree.</td><td><i class="say">I agree.</i></td></tr>
<tr><td>Let's discuss about it.</td><td><i class="say">Let's discuss it.</i></td></tr>
<tr><td>I have a question want to ask you.</td><td><i class="say">I have a question for you.</i></td></tr>
<tr><td>How to say…?</td><td><i class="say">How do you say this in English?</i></td></tr>
<tr><td>My English is very poor.</td><td><i class="say">I'm still working on my English.</i></td></tr>
<tr><td>Give you.</td><td><i class="say">Here you are.</i></td></tr>
<tr><td>I will contact with you.</td><td><i class="say">I'll contact you.</i></td></tr>
<tr><td>He is my good friend.</td><td><i class="say">He's a good friend of mine.</i></td></tr>
<tr><td>Please give me some advices.</td><td><i class="say">Could you give me some advice?</i></td></tr>
<tr><td>I'm boring.（想说我很无聊）</td><td><i class="say">I'm bored.</i></td></tr>
</table>
<h4>7. 自然的填充词，代替“嗯…呃…”</h4>
<p><i class="say">Well…</i>　<i class="say">Actually…</i>　<i class="say">Let me think.</i>　<i class="say">That's a good question.</i>　<i class="say">How can I put it…</i>　<i class="say">You know…</i></p>
<h4>8. 回应词让对话有来有往</h4>
<p><i class="say">Right.</i>　<i class="say">I see.</i>　<i class="say">Got it.</i>　<i class="say">That makes sense.</i>　<i class="say">Absolutely.</i>　<i class="say">Really? Tell me more.</i>　<i class="say">Fair enough.</i></p>`},

{id:"speaking",t:"口语技巧",h:`
<h4>1. 连读：让句子像一个长单词</h4>
<p>辅音结尾 + 元音开头会自然连在一起：<i class="say">pick it up</i>（pi-ki-tup）、<i class="say">an apple</i>、<i class="say">turn off</i>、<i class="say">look at it</i>。</p>
<h4>2. 弱读：虚词要读轻</h4>
<p>to / for / and / of / can / at 在句中通常弱化成 /ə/：<i class="say">I want to go.</i>（wanna）、<i class="say">a cup of tea</i>（cuppa）、<i class="say">fish and chips</i>（fish'n chips）。听力听不出，多半是因为不知道弱读。</p>
<h4>3. 句子重音：实词重读</h4>
<p>名词、动词、形容词、数字、否定词重读，其余轻快带过：<i class="say">I NEED the REPORT by FRIDAY.</i> 英文的节奏像“强-弱-弱-强”，不是中文的每字一样重。</p>
<h4>4. 语调</h4>
<ul>
<li>一般疑问句升调 ↗：<i class="say">Are you free tomorrow?</i></li>
<li>特殊疑问句降调 ↘：<i class="say">Where do you work?</i></li>
<li>陈述句降调 ↘，显得自信；句尾上扬会显得不确定。</li>
</ul>
<h4>5. 意群停顿</h4>
<p>按意思分组换气，而不是想到哪停到哪：<i class="say">In my opinion, / the market will recover / by the end of the year.</i></p>
<h4>6. 失爆与同化</h4>
<p>两个爆破音相邻，前一个只做口型不出声：<i class="say">good day</i>、<i class="say">hot dog</i>。d / t + y 会同化：<i class="say">Did you…?</i>（didju）、<i class="say">Nice to meet you.</i>（meechu）。</p>
<h4>7. 争取思考时间</h4>
<p>被问住时不要沉默或说中文，用这些句子争取 3-5 秒：<i class="say">That's a good question.</i>　<i class="say">Let me think about that for a second.</i>　<i class="say">Well, it depends.</i></p>
<h4>8. 不会的词就绕着说</h4>
<p><i class="say">It's a kind of…</i>　<i class="say">It's the thing you use to…</i>　<i class="say">It's like… but…</i>　<i class="say">I'm not sure of the word, but it means…</i></p>
<h4>9. 回答问题的三个框架</h4>
<ul>
<li><b>PREP</b>（观点题）：观点 → 理由 → 例子 → 观点</li>
<li><b>过去-现在-将来</b>（介绍类）：以前怎样 → 现在怎样 → 以后打算</li>
<li><b>STAR</b>（经历题）：情境 → 任务 → 行动 → 结果</li>
</ul>
<h4>10. 克服紧张</h4>
<ul>
<li>说慢一点。慢而清楚，比快而含糊专业得多。</li>
<li>用短句。一句话只说一件事。</li>
<li>没听懂就问：<i class="say">Sorry, could you say that again?</i> 这是专业，不是丢脸。</li>
<li>提前准备高频话题（自我介绍、工作、香港、金融市场），说到熟能生巧。</li>
</ul>
<h4>11. 在香港说英语</h4>
<p>香港同事的英语常带粤语口音、语速快、中英夹杂。刚开始听不懂很正常：多听 RTHK 英文台、多和同事吃午饭聊天，两三个月就会习惯。你自己不需要模仿港式口音，清晰、标准、礼貌就是最好的。</p>`},

{id:"templates",t:"万能口语句型",h:`
<h4>开场与寒暄</h4>
<p><i class="say">How's it going?</i>　<i class="say">How was your weekend?</i>　<i class="say">Busy day today?</i>　<i class="say">It's been a while!</i></p>
<h4>表达观点</h4>
<p><i class="say">I'd say…</i>　<i class="say">The way I see it…</i>　<i class="say">From my perspective…</i>　<i class="say">I'm fairly sure that…</i></p>
<h4>举例与解释</h4>
<p><i class="say">For instance…</i>　<i class="say">Take Hong Kong, for example.</i>　<i class="say">What I mean is…</i>　<i class="say">Let me put it another way.</i></p>
<h4>同意与反对</h4>
<p><i class="say">Exactly.</i>　<i class="say">That's a fair point.</i>　<i class="say">I see what you mean, but…</i>　<i class="say">I'm not so sure about that.</i></p>

const CONTR={"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","it's":"it is","that's":"that is","what's":"what is","there's":"there is","he's":"he is","she's":"she is","let's":"let us","i'll":"i will","you'll":"you will","we'll":"we will","it'll":"it will","i'd":"i would","you'd":"you would","we'd":"we would","i've":"i have","we've":"we have","you've":"you have","don't":"do not","doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","haven't":"have not","hasn't":"has not","couldn't":"could not","wouldn't":"would not","shouldn't":"should not","mustn't":"must not","where's":"where is","how's":"how is","who's":"who is"};
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];

function normTokens(s){
  s=String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/\([^)]*\)/g,' ').replace(/a\.m\./g,'am').replace(/p\.m\./g,'pm').replace(/%/g,' percent ').replace(/hk\$/g,' ').replace(/\$/g,' ').replace(/&/g,' and ');

    w=w.replace(/^'+|'+$/g,'');if(!w)return;
    if(CONTR[w]){CONTR[w].split(' ').forEach(function(x){out.push(x)});return}

  const r=lcsMatch(tt,st);

  owner.forEach(function(o,i){hasTok[o]=true;if(!r.ma[i])okW[o]=false});

/* 词汇测验（选择题） */
function buildQuiz(words,count){
  const pool=words.filter(function(w){return w.zh});const items=shuffle(pool).slice(0,Math.min(count,pool.length));
  return {items:items.map(function(w){const others=shuffle(pool.filter(function(o){return o.zh!==w.zh})).slice(0,3).map(function(o){return o.zh});const opts=shuffle(others.concat([w.zh]));return {w:w,opts:opts,ans:opts.indexOf(w.zh)}}),i:0,right:0,pick:-1,done:false};
}
function cardQuiz(id,words,count,title){
  const q=QZ[id];const best=S.quiz[id];
  let h='<section class="card" id="qz-'+id+'"><h2 class="sec-h">'+esc(title)+' <span class="tag">'+(best!=null?'最佳 '+best+'%':count+' 题')+'</span></h2>';
  if(!q){h+='<p class="muted">看英文选中文，共 '+Math.min(count,words.length)+' 题。答错的词会自动加入闪卡复习。</p><button class="btn jade" data-act="qz-start" data-id="'+id+'" data-count="'+count+'">开始测验</button>';return h+'</section>'}
  if(q.done){const pct=Math.round(q.right/q.items.length*100);h+='<div style="text-align:center"><div class="score '+scoreClass(pct)+'">'+pct+'%</div><p>答对 '+q.right+' / '+q.items.length+'</p><button class="btn jade" data-act="qz-start" data-id="'+id+'" data-count="'+count+'">再测一次</button></div>';return h+'</section>'}
  const it=q.items[q.i];
  h+='<p class="small muted" style="margin:0">第 '+(q.i+1)+' / '+q.items.length+' 题 · 已答对 '+q.right+'</p><div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="font-family:var(--font-display);font-size:26px;font-weight:700">'+esc(it.w.en)+'</span>'+sayBtn(it.w.en)+'</div><div class="opts">';
  it.opts.forEach(function(o,oi){let cls='opt';if(q.pick>=0){if(oi===it.ans)cls+=' right';else if(oi===q.pick)cls+=' wrong'}h+='<button class="'+cls+'" data-act="qz-ans" data-id="'+id+'" data-o="'+oi+'"'+(q.pick>=0?' disabled':'')+'>'+esc(o)+'</button>'});
  h+='</div>';

}

function runAsr(){
  if(!SP||SP.busy)return;

  if(TTS.ok&&TTS.voices.length){h+='<label class="f" for="voiceSel">声音</label><select id="voiceSel"><option value="">自动选择（推荐）</option>'+TTS.voices.map(function(v){return '<option value="'+esc(v.name)+'"'+(S.set.voice===v.name?' selected':'')+'>'+esc(v.name)+' · '+esc(v.lang)+'</option>'}).join('')+'</select>'}
  h+='<div class="btns"><button class="btn jade" data-say="Good morning. Welcome to Hong Kong. Let\'s get started.">'+ICON.spk+' 试听</button></div></section>';
  /* 兼容性 */
  const yes='<span class="pill ok">可用</span>',no='<span class="pill warn">不可用</span>';
  h+='<section class="card"><h2 class="sec-h">功能检测</h2><div class="rows">'+
   '<div class="row"><div class="txt">朗读（单词、句子、对话）</div>'+(TTS.ok?yes:no)+'</div>'+
   '<div class="row"><div class="txt">语音识别打分</div>'+(ASR.ok?yes:no)+'</div>'+
   '<div class="row"><div class="txt">录音回放</div>'+(REC.ok?yes:no)+'</div>'+
   '<div class="row"><div class="txt">本机保存进度</div>'+(Store.ok?yes:no)+'</div>'+
   '<div class="row"><div class="txt">云端同步进度</div>'+(Cloud.status==='on'?yes:'<span class="pill grey">未启用</span>')+'</div>'+
  '</div><p class="small muted" style="margin-bottom:0">建议用电脑或手机上的 Chrome / Edge / Safari 直接打开离线版 HTML 文件：朗读、录音、语音识别都能使用。在嵌入式预览中，麦克风可能被浏览器禁止，这时朗读和其他功能仍可正常使用。</p></section>';
  /* 数据 */
  h+='<section class="card"><h2 class="sec-h">进度备份</h2><p class="small muted" style="margin-top:0">进度会自动保存在本机浏览器里。换电脑、换浏览器或清理缓存前，请先导出备份文件，保存到你自己的电脑上。</p><div class="btns"><button class="btn jade" data-act="export">导出备份文件</button><button class="btn" data-act="copy-backup">复制备份代码</button><label class="btn" for="importFile" style="cursor:pointer">从文件导入</label><input type="file" id="importFile" accept=".json,application/json,text/plain" hidden></div>'+
   '<label class="f" for="importTxt">或者粘贴备份代码</label><textarea id="importTxt" placeholder="把复制的备份代码粘贴在这里"></textarea><div class="btns"><button class="btn" data-act="import-txt">导入粘贴的代码</button><button class="btn ghost" data-act="reset" style="color:var(--bad)">清空全部进度</button></div></section>';
  return h;
}
function backupJson(){return JSON.stringify({app:'hkfe90',v:1,exportedAt:new Date().toISOString(),state:S})}
function importData(text){
  let o;try{o=JSON.parse(String(text).trim())}catch(e){toast('备份内容无法识别，请检查是否完整复制');return}
  const st=o&&o.app==='hkfe90'&&o.state?o.state:o;
  if(!st||typeof st!=='object'||!('cur' in st)){toast('这不是本程序的备份文件');return}
  S=migrate(st);save();toast('导入成功，当前第 '+S.cur+' 天');FC=null;DT=null;TK=null;renderKeep();
}

/* ---------- 渲染与路由 ---------- */
function updateChrome(){
  const nav=document.querySelectorAll('.nav a');
  for(let i=0;i<nav.length;i++){const v=nav[i].getAttribute('data-v');if((view===v)||(view==='day'&&v==='plan'))nav[i].setAttribute('aria-current','page');else nav[i].removeAttribute('aria-current')}
  const st=$('topStat');if(st)st.innerHTML='<span class="pill red">第 '+S.cur+' 天</span>'+(Cloud.status==='on'?'<span class="pill ok" title="进度已云端同步">已同步</span>':(streak()?'<span class="pill">连续 '+streak()+' 天</span>':''));
}
function render(){
  const app=$('app');if(!app)return;
  let html='';
  try{
    if(view==='today')html=vDay(S.cur,true);
    else if(view==='day')html=vDay(viewArg,viewArg===S.cur);
    else if(view==='plan')html=vPlan();
    else if(view==='practice')html=vPractice();
    else if(view==='guide')html=vGuide();
    else if(view==='me')html=vMe();
  }catch(e){
    console.error('[render]',e);
    html='<section class="card err" style="margin-top:20px"><h2>页面显示出错</h2><p>你的学习进度不受影响。</p><div class="btns"><a class="btn" href="#today">回到今日</a><button class="btn" data-act="reload">重新加载</button></div></section>';
  }
  app.innerHTML=html;
  updateChrome();
}
function renderKeep(){const y=window.scrollY||0;render();try{window.scrollTo(0,y)}catch(e){}}
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  let v='today',arg=null;
  if(/^day-\d+$/.test(h)){v='day';arg=clampDay(h.slice(4))}
  else if(['today','plan','practice','guide','me'].indexOf(h)>=0)v=h;
  stopMedia();RP.active=false;RP.i=-1;clearInterval(TM.iv);TM.left=0;
  view=v;viewArg=arg;Cloud.deferred=false;render();
  try{window.scrollTo(0,0)}catch(e){}
}
function go(hash){if(location.hash==='#'+hash){route()}else{location.hash=hash}}

/* ---------- 角色扮演 ---------- */
function rpStep(){
  if(!RP.active)return;
  const d=dlgOf(RP.day,RP.w);
  if(RP.i>=d.length){RP.active=false;RP.wait=false;S.log[dkey()]=1;save();rerenderDlg();return}
  const l=d[RP.i];
  if(l.who===RP.me){RP.wait=true;rerenderDlg();return}
  RP.wait=false;rerenderDlg();
  TTS.speak(l.en,{quiet:true,onend:function(){if(!RP.active)return;RP.i++;rpStep()}});
}
function rerenderDlg(){const w=RP.w===1?1:0,el=$('dlgCard'+w);if(!el||!L[RP.day])return;const tmp=document.createElement('div');tmp.innerHTML=cardDlg(RP.day,w);el.parentNode.replaceChild(tmp.firstChild,el)}

function rerenderCard(id,fn){const el=$(id);if(!el){renderKeep();return}const tmp=document.createElement('div');tmp.innerHTML=fn();if(tmp.firstChild)el.parentNode.replaceChild(tmp.firstChild,el)}
function gxItems(key){if(/^g\d+$/.test(key)){const l=L[+key.slice(1)];return l&&l.gx}if(/^rg\d+$/.test(key)){const n=+key.slice(2);return gatherGx(n,typeOf(n)==='test'?15:10)}return null}
function gxTitle(key){return key.indexOf('rg')===0?'综合文法练习':'文法练习'}
function gxSub(key){if(key.indexOf('rg')===0){const n=+key.slice(2);return '从'+(typeOf(n)==='test'?'本阶段':'本周')+'随机抽题'}return '先自己选，再看解析'}
function trItems(key){if(/^t\d+$/.test(key)){const l=L[+key.slice(1)];return l&&l.tr}if(/^rt\d+$/.test(key)){const n=+key.slice(2);return gatherTr(n,typeOf(n)==='test'?15:10)}if(key==='ptr'&&PTR)return PTR;return null}
function rerenderTr(key){const items=trItems(key)||[];let title='中译英口头翻译',sub='看中文，先大声说出英文，再看答案';if(key.indexOf('rt')===0){title='综合中译英';const n=+key.slice(2);sub='从'+(typeOf(n)==='test'?'本阶段':'本周')+'随机抽题'}else if(key==='ptr'){title='口头翻译练习';sub='从已学内容中随机抽 10 句'}rerenderCard('tr-'+key,function(){return cardTr(key,items,title,sub)})}
/* ---------- 事件处理 ---------- */
function act(a,ds,el){
  const n=ds.day?clampDay(ds.day):S.cur;
  switch(a){
  case 'sheet-close':closeSheet();break;
  case 'blk':{const d=S.done[n]||(S.done[n]={});d[ds.k]=d[ds.k]?0:1;if(d[ds.k]){S.log[dkey()]=1;S.max=Math.max(S.max,n)}save();renderKeep();
    if(blocksDone(n)===7&&!S.fin[n])toast('7 个学习块全部完成！点页面底部“完成第 '+n+' 天”');break}
  case 'setcur':S.cur=n;S.max=Math.max(S.max,n);save();toast('已设为当前学习日：第 '+n+' 天');go('today');break;
  case 'finish':{
    const left=7-blocksDone(n);
    if(left>0){openSheet(function(){return '<h3>还有 '+left+' 个学习块没有勾选</h3><p>按计划完成 8 小时学习效果最好。确定要完成第 '+n+' 天吗？</p><div class="btns"><button class="btn pri" data-act="finish-yes" data-day="'+n+'">确定完成</button><button class="btn" data-act="sheet-close">继续学习</button></div>'});break}
    finishDay(n);break}
  case 'finish-yes':closeSheet();finishDay(n);break;
  case 'unfin':delete S.fin[n];save();renderKeep();break;
  case 'hidezh':S.set.hidezh=!S.set.hidezh;save();renderKeep();break;
  case 'say-all':{const days=srcDays(n);const words=typeOf(n)==='lesson'?L[n].words:wordsOf(days);TTS.chain(words.map(function(w){return w.en}));break}
  case 'dlg-all':{const w=+ds.w===1?1:0;if(RP.active){RP.active=false;rerenderDlg()}TTS.chain(dlgOf(n,w).map(function(l){return l.en}),{each:function(i){RP.day=n;RP.w=w;RP.i=i;RP.active=false;rerenderDlg()},onend:function(){RP.i=-1;rerenderDlg()}});break}
  case 'rp-start':{TTS.stop();const prev=RP.w;RP.active=false;if(RP.day===n&&prev!==(+ds.w===1?1:0)){RP.i=-1;rerenderDlg()}RP.day=n;RP.w=+ds.w===1?1:0;RP.me=ds.me;RP.i=0;RP.active=true;RP.wait=false;rpStep();break}
  case 'gx':{const st=GXS[ds.key]||(GXS[ds.key]={});const i=+ds.i;if(st[i]!==undefined)break;st[i]=+ds.o;S.log[dkey()]=1;
    const items=gxItems(ds.key);if(items){let c=0,all=true;items.forEach(function(it,k){if(st[k]===undefined)all=false;else if(st[k]===it.a)c++});if(all){S.quiz[ds.key]=Math.round(c/items.length*100);}save()}
    rerenderCard('gx-'+ds.key,function(){return cardGx(ds.key,items||[],gxTitle(ds.key),gxSub(ds.key))});break}
  case 'tr-show':{const st=TRS[ds.key]||(TRS[ds.key]={});st[+ds.i]=1;S.log[dkey()]=1;rerenderTr(ds.key);break}
  case 'tr-all':{const st=TRS[ds.key]||(TRS[ds.key]={});st.all=!st.all;rerenderTr(ds.key);break}
  case 'pt-all':TTS.chain(ptSentences(n));break;
  case 'trans-new':PTR=null;render();break;
  case 'rp-next':RP.i++;RP.wait=false;rpStep();break;
  case 'rp-stop':RP.active=false;RP.wait=false;TTS.stop();rerenderDlg();break;
  case 'tts-stop':TTS.stop();break;
  case 'shadow':SP={en:ds.en,zh:ds.zh,host:'sheet',res:null,busy:false,err:''};openSheet(function(){return '<h3>跟读练习</h3>'+speakBody()});break;
  case 'asr':runAsr();break;
  case 'timer':startTimer(+ds.m);break;
  case 'rw-start':rwStart(ds.id);break;
  case 'rw-stop':rwStop(ds.id);break;
  case 'rw-save':{const st=RW[ds.id];if(!st||!st.blob)break;const ext=/mp4|m4a|aac/.test(st.type||'')?'mp4':'webm';saveFile('english-recording-'+dkey()+'-'+Date.now().toString().slice(-5)+'.'+ext,st.blob,st.type).then(function(r){if(r==='fail')toast('保存失败：可以长按或右键音频选择“下载”')});break}
  case 'cards-day':PR.tab='cards';PR.src='day';PR.day=n;FC=null;go('practice');break;
  case 'dict-day':case 'dict-review':PR.tab='dict';PR.src='day';PR.day=n;DT=null;go('practice');break;
  case 'speak-review':PR.tab='speak';PR.src='day';PR.day=n;TK=null;SP=null;go('practice');break;
  case 'read-say':{const r=findReading(ds.key||String(n));if(r)TTS.chain(splitSentences(r.p),{slow:!!ds.slow});break}
  case 'read-ans':{const key=ds.key||String(n),st=RD[key]||(RD[key]={}),r=findReading(key);if(!r)break;st[+ds.q]=+ds.o;let c=0,all=true;r.q.forEach(function(q,i){if(st[i]===undefined)all=false;else if(st[i]===q[4])c++});if(all){S.quiz['r'+key]=Math.round(c/r.q.length*100);S.log[dkey()]=1;save()}renderKeep();break}
  case 'self':{const o=S.self[n]||(S.self[n]={v:[]});o.v[+ds.i]=+ds.v;save();renderKeep();break}
  case 'qz-start':{const id=ds.id;const words=id==='p'?learnedPool():wordsOf(srcDays(clampDay(id.slice(1))));QZ[id]=buildQuiz(words,+ds.count||20);renderKeep();break}
  case 'qz-ans':{const q=QZ[ds.id];if(!q||q.pick>=0)break;q.pick=+ds.o;const it=q.items[q.i];if(q.pick===it.ans)q.right++;else if(it.w.k){S.srs[it.w.k]={b:0,d:dnum()};save()}TTS.speak(it.w.en,{quiet:true});renderKeep();break}
  case 'qz-next':{const q=QZ[ds.id];if(!q)break;q.i++;q.pick=-1;if(q.i>=q.items.length){q.done=true;const pct=Math.round(q.right/q.items.length*100);S.quiz[ds.id]=Math.max(S.quiz[ds.id]||0,pct);S.log[dkey()]=1;save()}renderKeep();break}
  case 'ptab':PR.tab=ds.tab;stopMedia();render();break;
  case 'psrc':PR.src=ds.src==='cur'?'due':ds.src;if(ds.kind==='cards')FC=null;else if(ds.kind==='dict')DT=null;else{TK=null;SP=null}render();break;
  case 'cards-show':FC.show=true;TTS.speak((WMAP[FC.keys[FC.i]]||{}).en||'',{quiet:true});render();break;
  case 'cards-grade':{const g=+ds.g,k=FC.keys[FC.i];gradeWord(k,g);if(g===1){FC.a++;if(!FC.again[k]){FC.again[k]=1;FC.keys.push(k)}}else if(g===2)FC.b++;else FC.c++;FC.i++;FC.show=false;render();break}
  case 'cards-restart':FC=null;render();break;
  case 'dict-play':{if(!DT||!DT.list[DT.i])break;TTS.speak(DT.list[DT.i].en,{slow:!!ds.slow});setTimeout(function(){const i=$('dictIn');if(i&&!DT.checked)try{i.focus({preventScroll:true})}catch(e){}},50);break}
  case 'dict-check':case 'dict-skip':{const inp=$('dictIn');DT.input=inp?inp.value:'';const s=DT.list[DT.i];const r=compare(s.en,a==='dict-skip'?'':DT.input);DT.res=r;DT.checked=true;DT.sum+=r.score;DT.n++;S.log[dkey()]=1;save();renderKeep();break}
  case 'dict-next':DT.i++;DT.checked=false;DT.input='';DT.res=null;renderKeep();setTimeout(function(){if(DT&&DT.list[DT.i])TTS.speak(DT.list[DT.i].en,{quiet:true})},120);break;
  case 'dict-restart':DT=null;render();break;
  case 'tk-prev':TK.i=(TK.i-1+TK.list.length)%TK.list.length;SP=null;render();break;
  case 'tk-next':TK.i=(TK.i+1)%TK.list.length;SP=null;render();break;
  case 'topic-new':PR.topic=TOPICS[Math.floor(Math.random()*TOPICS.length)];render();break;
  case 'topic-iv':PR.topic=INTERVIEW[Math.floor(Math.random()*INTERVIEW.length)];render();break;
  case 'iv-go':PR.tab='talk';PR.topic=INTERVIEW[+ds.i]||INTERVIEW[0];go('practice');break;
  case 'accent':S.set.accent=ds.v;S.set.voice='';save();renderKeep();TTS.speak(ds.v==='en-GB'?'This is a British English voice.':'This is an American English voice.');break;
  case 'export':saveFile('hk-english-90-progress-'+dkey()+'.json',backupJson(),'application/json').then(function(r){if(r==='saved'||r==='direct')toast('已生成备份文件');else if(r==='declined')toast('已取消保存');else toast('无法保存文件，请用“复制备份代码”')});break;
  case 'copy-backup':copyText(backupJson()).then(function(ok){toast(ok?'备份代码已复制，请粘贴保存到你电脑的记事本里':'复制失败，请改用导出文件')});break;
  case 'import-txt':{const t=$('importTxt');if(t&&t.value.trim())importData(t.value);else toast('请先粘贴备份代码');break}
  case 'reset':openSheet(function(){return '<h3>清空全部学习进度？</h3><p>所有勾选、单词复习记录和测验成绩都会被删除，且无法恢复。建议先导出备份。</p><div class="btns"><button class="btn pri" data-act="reset-yes">确定清空</button><button class="btn" data-act="sheet-close">取消</button></div>'});break;
  case 'reset-yes':S=fresh();save();closeSheet();FC=null;DT=null;TK=null;toast('进度已清空');go('today');break;
  case 'reload':try{location.reload()}catch(e){}break;
  case 'no-install':S.set.noInstall=true;save();renderKeep();break;
  }
}
function finishDay(n){
  S.fin[n]=1;S.log[dkey()]=1;
  if(n===S.cur&&n<90){S.cur=n+1;S.max=Math.max(S.max,S.cur)}
  save();
  if(n===90){openSheet(function(){return '<h3>恭喜你完成 90 天！</h3><p>你已经学习了 '+learnedPool().length+' 个单词、几百个句子和 75 段情景对话。把第 2 天和今天的录音放在一起听，这就是你的进步。</p><p>接下来：继续每天闪卡复习、每周录音一次，把英语用在真实的工作场景中。</p><div class="btns"><button class="btn pri" data-act="sheet-close">好的</button></div>'});renderKeep();return}
  toast('第 '+n+' 天完成！');
  if(view==='today'||(view==='day'&&viewArg===n))go('today');else renderKeep();
}

/* ---------- 启动 ---------- */
function boot(){
  TTS.init();
  document.addEventListener('click',function(e){
    const t=e.target;if(!t||!t.closest)return;
    if(t.classList&&t.classList.contains('scrim')){closeSheet();return}
    const sayEl=t.closest('[data-say]');
    if(sayEl){e.preventDefault();safe(function(){TTS.speak(sayEl.getAttribute('data-say'),{slow:sayEl.getAttribute('data-slow')==='1'})},'say');return}
    const sayI=t.closest('i.say');
    if(sayI){safe(function(){TTS.speak(sayI.textContent)},'say');return}
    const sm=t.closest('summary[data-gid]');
    if(sm){const id=sm.getAttribute('data-gid');setTimeout(function(){const d=$('g-'+id);if(d)GOPEN[id]=d.open},0);return}
    const a=t.closest('[data-act]');
    if(a&&a.getAttribute('data-act')!=='sheet-scrim'){e.preventDefault();safe(function(){act(a.getAttribute('data-act'),a.dataset||{},a)},'act')}
  });
  document.addEventListener('input',function(e){
    const t=e.target;if(!t)return;
    if(t.id==='rate'){S.set.rate=Math.max(0.5,Math.min(1.3,parseFloat(t.value)||0.9));const v=$('rateV');if(v)v.textContent=S.set.rate.toFixed(2);clearTimeout(window.__rt);window.__rt=setTimeout(save,400)}
    if(t.id==='dictIn'&&DT)DT.input=t.value;
  });
  document.addEventListener('change',function(e){
    const t=e.target;if(!t)return;
    if(t.id==='voiceSel'){S.set.voice=t.value;save();TTS.speak('Hello, this is the voice you selected.')}
    if(t.id==='importFile'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=function(){importData(fr.result)};fr.onerror=function(){toast('文件读取失败')};try{fr.readAsText(t.files[0])}catch(x){toast('文件读取失败')}t.value=''}
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&SHEET){closeSheet();return}
    if(e.key==='Enter'&&e.target&&e.target.id==='dictIn'&&DT&&!DT.checked){e.preventDefault();safe(function(){act('dict-check',{})},'dict')}
  });
  window.addEventListener('hashchange',function(){safe(route,'route')});
  window.addEventListener('error',function(e){console.warn('[runtime]',e&&e.message)});
  window.addEventListener('unhandledrejection',function(e){console.warn('[unhandled]',e&&e.reason);try{e.preventDefault()}catch(x){}});
  window.addEventListener('pagehide',function(){stopMedia();if(Cloud.ref)Cloud.flush()});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')safe(function(){Cloud.refresh()},'cloud');else if(Cloud.ref)Cloud.flush()});
  document.addEventListener('focusout',function(){setTimeout(flushDeferred,300)});
  setInterval(flushDeferred,4000);
  route();
  safe(registerSW,'sw');
  setTimeout(function(){safe(function(){Cloud.init()},'cloud')},200);
  const ld=$('loading');if(ld)ld.remove();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){safe(boot,'boot')});else safe(boot,'boot');

</script>
