<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="零基础 90 天香港金融英语口语学习程序：单词、句型、文法、对话、听力、阅读、口语练习">
<title>90天香港金融英语</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="金融英语90天">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>window.__PWA=true</script>
<style>
/* layout: one-column study planner — sticky day header, timetable timeline, section cards, bottom tab bar */
:root{
  --bg:#eef3f3; --surface:#ffffff; --surface-2:#f6f9f9; --ink:#13232b; --muted:#5a6b73; --line:#d6e0e3;
  --accent:#c8102e; --accent-ink:#ffffff; --accent-soft:#fbe4e7; --jade:#0d6b63; --jade-ink:#ffffff; --jade-soft:#e0f0ed;
  --ok:#1b7f47; --ok-soft:#e2f3e8; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe5e3;
  --font-display:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",Roboto,sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(19,35,43,.06),0 4px 14px rgba(19,35,43,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1518; --surface:#162126; --surface-2:#1b282e; --ink:#e6eef0; --muted:#94a6ad; --line:#26363d;
    --accent:#ff5b6f; --accent-ink:#1a0a0d; --accent-soft:#3a1c22; --jade:#57c5b6; --jade-ink:#06201c; --jade-soft:#17322f;
    --ok:#5fd08f; --ok-soft:#173326; --warn:#f0b45c; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1d1b;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1518; --surface:#162126; --surface-2:#1b282e; --ink:#e6eef0; --muted:#94a6ad; --line:#26363d;
  --accent:#ff5b6f; --accent-ink:#1a0a0d; --accent-soft:#3a1c22; --jade:#57c5b6; --jade-ink:#06201c; --jade-soft:#17322f;
  --ok:#5fd08f; --ok-soft:#173326; --warn:#f0b45c; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
a{color:var(--jade)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--font-body);font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--jade-soft);color:var(--jade);white-space:nowrap}
.pill.red{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent)}

/* hero for a day */
.hero{padding:18px 0 6px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.dnum{font-family:var(--font-display);font-size:56px;line-height:.9;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.dnum small{display:block;font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.htitle h1{font-size:22px;line-height:1.25}
.htitle .en{font-family:var(--font-display);font-style:italic;color:var(--muted);font-size:16px}
.hmeta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .3s}
.daynav{display:flex;gap:8px;margin:12px 0 4px}
.daynav .btn{flex:1}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:14px 0}
.card > h2,.sec-h{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-h .tag{font-family:var(--font-body);font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-left:auto}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.note{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}

/* timetable */
.tt{list-style:none;margin:0;padding:0;position:relative}
.tt li{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tt li:first-child{border-top:0}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;transition:all .15s}
.chk svg{width:16px;height:16px;opacity:0}
.chk[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.chk[aria-pressed="true"] svg{opacity:1}
.tt .time{font-size:12.5px;font-weight:700;color:var(--jade);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.tt .bt{font-weight:700}
.tt .bd{font-size:14px;color:var(--muted)}
.tt li.done .bt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:0}
.row .en{font-weight:600;overflow-wrap:anywhere}
.row .zh{font-size:14px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-shrink:0}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.word{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px;min-width:0}
.word .txt{flex:1;min-width:0}
.word .en{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.word .zh{font-size:13px;color:var(--muted);line-height:1.35}
.hidezh .zh{filter:blur(5px);transition:filter .2s}
.hidezh .zh:hover,.hidezh .zh:active{filter:none}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14.5px;line-height:1.2;min-height:40px}
.btn:hover{border-color:var(--jade)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.jade{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;padding:0;font-size:12.5px;font-weight:700;color:var(--jade);flex-shrink:0}
.ic svg{width:18px;height:18px}
.ic:hover{border-color:var(--jade)}
.ic.rec{color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--jade-ink)}

/* grammar */
.gram p{margin:0 0 10px}

/* dialogue */
.dlg{display:flex;flex-direction:column;gap:8px}
.ln{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;border:1px solid transparent}
.ln .who{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--jade-soft);color:var(--jade);flex-shrink:0;margin-top:2px}
.ln.B .who{background:var(--accent-soft);color:var(--accent)}
.ln.C .who{background:var(--warn-soft);color:var(--warn)}
.ln .txt{flex:1;min-width:0}
.ln .en{font-weight:600}
.ln .zh{font-size:14px;color:var(--muted)}
.ln.on{border-color:var(--jade);background:var(--jade-soft)}
.ln.me.on{border-color:var(--accent);background:var(--accent-soft)}
.rpbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}

/* plan grid */
.phase{margin:18px 0}
.phase h2{font-size:18px}
.phase .pd{font-size:14px;color:var(--muted);margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;text-decoration:none;color:var(--ink);position:relative;min-width:0}
.cell b{font-family:var(--font-display);font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.cell span{font-size:10px;color:var(--muted);line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.review{background:var(--warn-soft);border-color:transparent}
.cell.test{background:var(--accent-soft);border-color:transparent}
.cell.part{box-shadow:inset 0 -4px 0 var(--jade)}
.cell.fin{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.cell.fin span{color:var(--jade-ink);opacity:.85}
.cell.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}

/* practice */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flash{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px 12px}
.flash .big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.flash .ans{font-size:20px;font-weight:600}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{flex-direction:column;gap:0;padding:8px}
.grade .btn small{font-weight:500;color:var(--muted);font-size:11.5px}
.grade .b1{border-color:var(--bad);color:var(--bad)}
.grade .b2{border-color:var(--warn);color:var(--warn)}
.grade .b3{border-color:var(--ok);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--font-display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--jade)}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.diff{line-height:2;font-size:17px}
.diff .ok{color:var(--ok);font-weight:600}
.diff .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px;font-weight:600}
.diff .extra{color:var(--warn);text-decoration:line-through}
.score{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)}.score.mid{color:var(--warn)}.score.low{color:var(--bad)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:500}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.timer{font-family:var(--font-display);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1;margin:6px 0}
.passage{font-family:var(--font-display);font-size:17.5px;line-height:1.75;max-width:65ch}

/* guide */
details.gd{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;box-shadow:var(--shadow)}
details.gd > summary{list-style:none;padding:14px 16px;font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.gd > summary::-webkit-details-marker{display:none}
details.gd > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;transition:transform .2s}
details.gd[open] > summary::after{transform:rotate(-135deg)}
details.gd .gb{padding:0 16px 16px;max-width:70ch}
.gb h4{font-size:15.5px;margin:16px 0 6px;color:var(--jade)}
.gb p,.gb li{font-size:15px}
.gb ul,.gb ol{padding-left:20px;margin:6px 0}
.gb table{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
.gb th,.gb td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.gb th{color:var(--muted);font-weight:600}
i.say{font-style:normal;font-weight:600;color:var(--ink);background:var(--jade-soft);border-radius:6px;padding:1px 6px;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
i.say:hover{outline:1px solid var(--jade)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.letters button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;font-family:var(--font-display);font-size:20px;font-weight:700}
.ipa{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.ipa button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 6px;text-align:center;line-height:1.25}
.ipa b{display:block;font-size:19px;font-family:"Lucida Sans Unicode","Arial Unicode MS","Segoe UI",sans-serif}
.ipa span{font-size:12.5px;color:var(--muted)}
.ipa small{display:block;font-size:10.5px;color:var(--muted)}
.qlist{counter-reset:q;list-style:none;padding:0;margin:0}
.qlist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qlist li::before{counter-increment:q;content:counter(q);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:var(--muted);width:22px;text-align:right;flex-shrink:0}
.qlist .t{flex:1;font-weight:600}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:rgba(8,14,16,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheet h3{font-size:17px;margin-bottom:8px}
.sheet .x{float:right}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:80%}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.err{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.dnum{font-size:46px}.htitle h1{font-size:20px}.words{grid-template-columns:1fr 1fr}.cell span{display:none}.brand small{display:none}.card{padding:14px}}

/* extended lessons */
.wlist{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:700px){.wlist{grid-template-columns:1fr 1fr;column-gap:20px}}
.wrow{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.wrow .txt{flex:1;min-width:0}
.wrow .en{font-weight:700;overflow-wrap:anywhere}
.wrow .zh{font-size:13.5px;color:var(--muted)}
.wrow .acts{padding-top:2px}
.ipa{font-family:"Lucida Sans Unicode","Arial Unicode MS","Segoe UI","Noto Sans",sans-serif;font-weight:400;font-size:14px;color:var(--jade);white-space:nowrap}
.ex{font-size:14px;margin-top:3px;line-height:1.45;color:var(--ink)}
.ex .zh{display:block;font-size:13px}
.hidezh .zh,.hidezh .ex .zh{filter:blur(5px);transition:filter .2s}
.hidezh .zh:hover,.hidezh .zh:active{filter:none}
details.more>summary{cursor:pointer;font-weight:600;color:var(--jade);padding:6px 0;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";}
details.more[open]>summary::before{content:"▾ ";}
.gxq{padding:10px 0;border-top:1px solid var(--line)}
.gxq:first-of-type{border-top:0}
.gxq .q{margin-bottom:8px;font-size:15.5px}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--jade);color:transparent;line-height:1}
.seg.choice{display:flex;flex-wrap:wrap;border:0;gap:6px;overflow:visible}
.seg.choice button{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:600}
.seg.choice button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg.choice button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.seg.choice button:disabled{cursor:default}
.gxe{font-size:14px;margin:8px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gxe.ok{color:var(--ok)}.gxe.bad{color:var(--bad)}

<script>
/* 第一阶段 Day 1-30：零基础筑基 —— 发音 · 生存英语 · 基本句型 */
D(1,{t:"问候与字母",e:"Greetings & the Alphabet",
w:"hello|你好;hi|嗨;good morning|早上好;good afternoon|下午好;good evening|晚上好;goodbye|再见;see you|回头见;thank you|谢谢;you're welcome|不客气;sorry|对不起;excuse me|打扰一下;please|请;yes|是的;no|不;nice to meet you|很高兴认识你",
s:["Good morning! How are you?|早上好！你好吗？","I'm good, thanks. And you?|我很好，谢谢。你呢？","Nice to meet you.|很高兴认识你。","Excuse me, could you say that again?|打扰一下，你能再说一遍吗？","Sorry, I don't understand.|抱歉，我听不懂。","See you tomorrow.|明天见。"],
g:["英语句子的骨架：主语 + 动词","英语每个完整句子都必须有主语和谓语动词。中文可以说“早上好”“下雨了”，英文常要补出主语：It's raining。先建立一个最重要的习惯：先想“谁”，再想“做什么”。",["I work.|我工作。","You learn.|你学习。","It's raining.|下雨了。"]],
c:["A|Good morning! I'm Tom.|早上好！我是 Tom。","B|Good morning, Tom. I'm Shello. Nice to meet you.|早上好，Tom。我是 Shello，很高兴认识你。","A|Nice to meet you too. How are you?|我也很高兴认识你。你好吗？","B|I'm good, thanks. And you?|我很好，谢谢。你呢？","A|Very well, thank you. See you later!|很好，谢谢。回头见！","B|See you!|再见！"],
k:"① 在“技巧 → 发音入门”里把 26 个字母逐个点读、跟读 3 遍；② 用字母拼读自己的英文名（S-H-E-L-L-O）；③ 对着镜子用 3 种不同方式打招呼并录音，和原音对比。"});

D(2,{t:"自我介绍",e:"Introducing Yourself",
w:"name|名字;from|来自;China|中国;Hong Kong|香港;live|居住;work|工作(动词);job|工作/职业;student|学生;finance|金融;bank|银行;company|公司;new|新的;English|英语;learn|学习;now|现在",
s:["My name is Shello.|我叫 Shello。","I'm from China.|我来自中国。","I live in Hong Kong now.|我现在住在香港。","I work in finance.|我在金融行业工作。","I'm new here.|我是新来的。","I'm learning English.|我正在学英语。"],
g:["be 动词：am / is / are","I 用 am；you / we / they 用 are；he / she / it 用 is。否定在 be 后加 not（I'm not…），疑问把 be 提到句首（Are you…?）。口语里一定要用缩写：I'm、you're、she's、it's。",["I am a student.|我是学生。","She is from Hong Kong.|她来自香港。","Are you new here? Yes, I am.|你是新来的吗？是的。"]],
c:["A|Hi, I'm Kelly. What's your name?|嗨，我是 Kelly。你叫什么名字？","B|My name is Shello. Nice to meet you.|我叫 Shello，很高兴认识你。","A|Nice to meet you. Where are you from?|很高兴认识你。你是哪里人？","B|I'm from China. I live in Hong Kong now.|我来自中国，现在住在香港。","A|What do you do?|你是做什么工作的？","B|I work in finance. I'm new here.|我做金融，我是新来的。"],
k:"写出并背诵 30 秒自我介绍（名字、来自哪里、住在哪里、做什么工作），录音 3 遍，每一遍都比上一遍更流畅。"});

D(3,{t:"数字与电话号码",e:"Numbers & Phone Numbers",
w:"zero|零;three|三;eight|八;eleven|十一;twelve|十二;thirteen|十三;thirty|三十;fifteen|十五;fifty|五十;hundred|百;phone number|电话号码;email address|电邮地址;how many|多少(可数);double|两个相同的(读号码时);spell|拼写",
s:["What's your phone number?|你的电话号码是多少？","It's 6123, 4567.|是 6123 4567。","Could you spell that, please?|请拼一下好吗？","My email is shello at example dot com.|我的电邮是 shello@example.com。","Thirteen or thirty?|是十三还是三十？","How many people are in your team?|你们团队有多少人？"],
g:["特殊疑问句与数字读法","What's…? / How many…? 结构：疑问词 + be/助动词 + 主语。数字重音：13-19 重音在后（thir-TEEN），20-90 重音在前（THIR-ty），这是电话里最容易听错的地方。香港电话 8 位，习惯 4+4 分组读；相同数字连读可说 double（66 = double six）。",["What's your name?|你叫什么名字？","How many colleagues do you have?|你有多少同事？","6688: double six, double eight.|6688 读作 double six, double eight。"]],
c:["A|Can I have your phone number?|可以给我你的电话号码吗？","B|Sure. It's 6123, 4567.|当然，是 6123 4567。","A|Sorry, is that 6123, 4567?|抱歉，是 6123 4567 吗？","B|Yes, that's right.|对，没错。","A|And your email address?|那你的电邮地址呢？","B|It's shello dot wong at example dot com.|是 shello.wong@example.com。"],
k:"大声读 13/30、14/40、15/50、16/60 各 10 遍；用英文读出你自己的手机号、生日、楼层号；请朋友随机读数字给你听写（或用“练习 → 听写”）。"});

D(4,{t:"家人与身边的人",e:"Family & People",
w:"family|家庭;father|父亲;mother|母亲;parents|父母;brother|兄弟;sister|姐妹;husband|丈夫;wife|妻子;son|儿子;daughter|女儿;friend|朋友;colleague|同事;married|已婚的;single|单身的;children|孩子们",
s:["I have a small family.|我家人不多。","I have one brother and one sister.|我有一个兄弟和一个姐妹。","My parents live in Guangzhou.|我父母住在广州。","She is my colleague.|她是我的同事。","Do you have any children?|你有孩子吗？","His wife works in a bank.|他太太在银行工作。"],
g:["have / has 与物主代词","have / has 表示“有”：I / you / we / they have，he / she / it has。物主代词：my 我的，your 你的，his 他的，her 她的，our 我们的，their 他们的。",["She has two children.|她有两个孩子。","Our team has ten people.|我们团队有十个人。","Their office is in Central.|他们的办公室在中环。"]],
c:["A|Do you have a big family?|你家人多吗？","B|Not really. I have a small family.|不算多，我家人不多。","A|Do you have any brothers or sisters?|你有兄弟姐妹吗？","B|I have one sister. She's a teacher.|我有一个姐姐，她是老师。","A|Do your parents live in Hong Kong?|你父母住在香港吗？","B|No, they live in Guangzhou.|不，他们住在广州。"],
k:"拿出家人或同事的照片，用 This is my… / He is… / She has… 介绍 5 个人，每人 2-3 句，录音。"});

D(5,{t:"时间与日期",e:"Time & Dates",
w:"time|时间;o'clock|…点钟;half past|…点半;quarter|一刻钟;morning|上午;afternoon|下午;evening|傍晚;today|今天;tomorrow|明天;yesterday|昨天;week|周;month|月;Monday|星期一;Friday|星期五;weekend|周末",
s:["What time is it?|现在几点？","It's half past nine.|九点半。","The meeting is at 3 p.m.|会议在下午三点。","I'm free on Friday afternoon.|我星期五下午有空。","My birthday is in May.|我的生日在五月。","See you on Monday morning.|星期一早上见。"],
g:["时间介词 at / on / in","at + 具体时刻（at 9:00, at noon）；on + 某一天 / 日期（on Monday, on 3 May）；in + 月 / 年 / 季节 / 上午下午（in May, in 2026, in the morning）。口诀：点用 at，天用 on，更长用 in。",["I start work at 9 a.m.|我早上九点开始上班。","We have a meeting on Tuesday.|我们星期二有个会。","The report is due in December.|报告十二月到期。"]],
c:["A|What time is the meeting?|会议几点？","B|It's at 10:30 on Wednesday.|星期三十点半。","A|Wednesday morning?|星期三上午？","B|Yes. Are you free then?|对，你那时有空吗？","A|Sorry, I'm busy in the morning. How about 2 p.m.?|抱歉，我上午很忙。下午两点怎么样？","B|2 p.m. works for me.|下午两点我可以。"],
k:"用英文说出你这一周每天的安排（星期 + 时间 + 做什么），至少 7 句，必须用上 at / on / in。"});

D(6,{t:"日常作息",e:"Daily Routine",
w:"get up|起床;have breakfast|吃早餐;take the MTR|坐港铁;go to work|上班;start|开始;finish|结束;lunch|午餐;usually|通常;always|总是;sometimes|有时;never|从不;every day|每天;go home|回家;cook|做饭;go to bed|上床睡觉",
s:["I usually get up at seven.|我通常七点起床。","I take the MTR to work.|我坐港铁上班。","I start work at nine.|我九点开始工作。","She always has lunch at her desk.|她总是在办公桌前吃午饭。","I sometimes work late.|我有时加班到很晚。","I go to bed at eleven.|我十一点睡觉。"],
g:["一般现在时与第三人称单数","一般现在时表示习惯和事实。主语是 he / she / it 时，动词加 -s / -es：work → works，go → goes，have → has，study → studies。否定用 don't / doesn't + 动词原形。频率副词（always, usually, sometimes, never）放在实义动词前、be 动词后。",["He works in Central.|他在中环上班。","She doesn't drink coffee.|她不喝咖啡。","Do you take the bus?|你坐巴士吗？"]],
c:["A|What time do you usually get up?|你通常几点起床？","B|Around seven. Then I have breakfast.|七点左右，然后吃早餐。","A|How do you get to work?|你怎么去上班？","B|I take the MTR. It takes about 30 minutes.|坐港铁，大约 30 分钟。","A|Do you work late?|你会加班吗？","B|Sometimes, especially at the end of the month.|有时会，尤其是月底。"],
k:"计时 1 分钟，不停顿地描述你的一天（从起床到睡觉）；再用 he / she 描述一位朋友的一天，注意动词加 s。"});

D(8,{t:"点餐",e:"Food & Ordering",
w:"menu|菜单;order|点餐;coffee|咖啡;tea|茶;milk tea|奶茶;rice|米饭;noodles|面条;chicken|鸡肉;beef|牛肉;vegetables|蔬菜;water|水;takeaway|外卖/打包;bill|账单;delicious|美味的;spicy|辣的",
s:["Can I see the menu, please?|可以看一下菜单吗？","I'd like a milk tea, please.|我要一杯奶茶，谢谢。","Can I have the chicken rice?|我可以要鸡饭吗？","For here or to go?|堂食还是外带？","Takeaway, please.|外带，谢谢。","Could we have the bill, please?|麻烦买单。"],
g:["礼貌点单：I'd like… / Can I have…?","I'd like…（= I would like）比 I want… 礼貌得多。Can I have…? / Could I get…? 也很常用。直接说 Give me a coffee 会显得生硬。点单时把 please 放在句尾，语气自然。",["I'd like a coffee, please.|我要一杯咖啡，谢谢。","Could I get some water?|可以给我一些水吗？","Would you like anything else?|还需要别的吗？"]],
c:["A|Hi, are you ready to order?|你好，可以点餐了吗？","B|Yes. I'd like the beef noodles, please.|可以，我要牛肉面，谢谢。","A|Anything to drink?|要喝点什么吗？","B|A hot milk tea, less sugar, please.|一杯热奶茶，少糖，谢谢。","A|For here or takeaway?|堂食还是外带？","B|For here. Thanks.|堂食，谢谢。"],
k:"模拟在茶餐厅和咖啡店各点一次单（要什么、甜度/温度、堂食/外带、买单），全程录音。下次真实点餐时坚持用英文。"});

D(9,{t:"问路与地点",e:"Places & Directions",
w:"where|哪里;near|在…附近;next to|紧挨着;opposite|在…对面;between|在…之间;behind|在…后面;in front of|在…前面;turn left|左转;turn right|右转;go straight|直走;corner|拐角;building|大楼;floor|楼层;lift|电梯(英式);exit|出口",
s:["Excuse me, where is the nearest MTR station?|打扰一下，最近的港铁站在哪里？","Go straight and turn left at the corner.|直走，在拐角左转。","It's next to the bank.|就在银行旁边。","There is a 7-Eleven opposite the building.|大楼对面有一家 7-Eleven。","Our office is on the 25th floor.|我们的办公室在 25 楼。","Take Exit A and you'll see it.|从 A 出口出去就能看到。"],
g:["There is / There are + 方位介词","There is + 单数 / There are + 复数，表示“某处有…”。方位介词放在地点前：next to the bank，opposite the mall。香港多用英式英语：lift（电梯）、ground floor（地面层）、first floor（二楼）。",["There is a café on the ground floor.|地面层有一家咖啡店。","There are two lifts in the lobby.|大堂有两部电梯。","Is there a bank near here?|这附近有银行吗？"]],
c:["A|Excuse me, is there a bank near here?|打扰一下，这附近有银行吗？","B|Yes, there's one on Queen's Road.|有，皇后大道上有一家。","A|How do I get there?|怎么走？","B|Go straight, then turn right at the second corner.|直走，然后在第二个拐角右转。","A|Is it far?|远吗？","B|No, it's about five minutes on foot. It's opposite a big shopping mall.|不远，走路大约五分钟，在一个大商场对面。"],
k:"描述从你家到最近港铁站的路线；再描述你理想中的办公大楼（在几楼、旁边有什么、对面有什么），至少 8 句。"});

D(10,{t:"香港交通出行",e:"Getting Around Hong Kong",
w:"MTR|港铁;bus|巴士;taxi|的士;minibus|小巴;ferry|渡轮;Octopus card|八达通;station|车站;platform|月台;line|线路;change|换乘;stop|站/停;ticket|票;fare|车费;traffic|交通;late|迟到的",
s:["Can I pay with an Octopus card?|可以用八达通付款吗？","Change to the Island Line at Admiralty.|在金钟转港岛线。","Which exit should I take?|我应该走哪个出口？","Please take me to Central.|请载我去中环。","Sorry, I'm late. The traffic was terrible.|抱歉我迟到了，交通太堵了。","How long does it take?|要多久？"],
g:["情态动词 can / can't","can 表示能力或许可：can + 动词原形，主语是谁都不变。否定 can't（英式读 /kɑːnt/，美式读 /kænt/）。Can I…? 用于请求许可，Can you…? 用于请别人帮忙。",["I can speak a little English.|我会说一点英语。","You can't park here.|你不能在这里停车。","Can you help me?|你能帮我吗？"]],
c:["A|Excuse me, how can I get to Central?|打扰一下，怎么去中环？","B|You can take the Tsuen Wan Line. It's four stops from here.|你可以坐荃湾线，离这里四站。","A|Do I need to change?|需要换乘吗？","B|No, it's direct.|不用，直达。","A|Can I use my Octopus card?|可以用八达通吗？","B|Of course.|当然可以。"],
k:"用 can / can't 说出你会做和不会做的 10 件事；模拟坐的士：告诉司机目的地、确认路线、付款。"});

D(11,{t:"购物与付款",e:"Shopping & Money",
w:"price|价格;how much|多少钱;cheap|便宜的;expensive|贵的;discount|折扣;cash|现金;credit card|信用卡;pay|付款;change|找零;receipt|收据;size|尺码;try on|试穿;buy|买;sell|卖;Hong Kong dollar|港币",
s:["How much is this?|这个多少钱？","It's 280 Hong Kong dollars.|280 港元。","Is there any discount?|有折扣吗？","Can I pay by credit card?|可以刷信用卡吗？","Can I have a receipt, please?|可以给我收据吗？","Do you have this in a larger size?|这个有大一码的吗？"],
g:["可数名词与不可数名词","可数名词有复数，用 how many / a few / many；不可数名词没有复数，用 how much / a little / much。金融行业高频不可数名词：money, cash, information, advice, feedback, research, equipment —— 不能加 s，不能说 an advice。",["How much money do you need?|你需要多少钱？","How many accounts do you have?|你有几个账户？","Can you give me some advice?|你能给我一些建议吗？"]],
c:["A|Hi, how much is this jacket?|你好，这件外套多少钱？","B|It's 680 dollars, but there's a 20% discount today.|680 元，不过今天打八折。","A|So it's 544 dollars?|那就是 544 元？","B|That's right.|没错。","A|Can I pay with Octopus?|可以用八达通付吗？","B|Sorry, only cash or credit card.|抱歉，只收现金或信用卡。"],
k:"大声读价格：$38、$280、$1,450、$12,800、$365,000；扮演顾客询价、问折扣、问尺码、付款、要收据。"});

D(12,{t:"天气与闲聊",e:"Weather & Small Talk",
w:"weather|天气;hot|热的;cold|冷的;humid|潮湿的;sunny|晴朗的;rainy|下雨的;cloudy|多云的;windy|大风的;typhoon|台风;rainstorm warning|暴雨警告;umbrella|雨伞;nice|好的;terrible|糟糕的;forecast|天气预报;degree|度",
s:["It's so humid today.|今天好潮湿。","It's going to rain this afternoon.|今天下午会下雨。","Typhoon Signal No. 8 is up.|八号风球挂起了。","Lovely weather, isn't it?|天气真好，是吧？","Don't forget your umbrella.|别忘了带伞。","It's about 30 degrees.|大约 30 度。"],
g:["It's + 形容词：谈天气","谈天气用 It's + 形容词（It 是形式主语，没有实际意思）。形容词可以放在名词前（a hot day），也可以放在 be 动词后（It is hot）。闲聊万能开场四件套：天气、周末、午餐、通勤。",["It's really hot today.|今天真热。","What a beautiful day!|多好的天气啊！","What's the weather like tomorrow?|明天天气怎么样？"]],
c:["A|Morning! It's so hot today, isn't it?|早！今天好热，是吧？","B|Yes, and really humid. I hate this weather.|是啊，还特别潮湿，我讨厌这种天气。","A|I heard there might be a typhoon this weekend.|听说这个周末可能有台风。","B|Really? I hope it's not a Signal 8.|真的吗？希望不要挂八号风球。","A|Me too. I have plans on Saturday.|我也是，我星期六有安排。","B|Let's check the forecast later.|我们晚点看看天气预报。"],
k:"和“同事”进行 3 轮电梯闲聊（每轮 30 秒）：天气、周末、午餐。要求每轮都以一个问题结尾，让对话继续下去。"});

D(13,{t:"兴趣爱好",e:"Hobbies & Free Time",
w:"hobby|爱好;free time|空闲时间;like|喜欢;enjoy|享受;love|热爱;hate|讨厌;reading|阅读;hiking|远足;swimming|游泳;watching movies|看电影;travel|旅行;music|音乐;sport|运动;gym|健身房;interested in|对…感兴趣",
s:["What do you do in your free time?|你空闲时做什么？","I enjoy hiking on weekends.|我周末喜欢去远足。","I'm really into reading.|我特别喜欢阅读。","I'm interested in investing.|我对投资感兴趣。","I don't like shopping very much.|我不太喜欢购物。","How about you?|你呢？"],
g:["like / enjoy / love + doing","like / love / enjoy / hate 后面接动词 -ing（enjoy reading）。be interested in + 名词或动名词。注意：“非常喜欢”要说 I really like…，不能说 I very like…（very 不能修饰动词）。",["I love travelling.|我热爱旅行。","She enjoys cooking for her family.|她喜欢给家人做饭。","I'm interested in learning about the stock market.|我对了解股市很感兴趣。"]],
c:["A|What do you like doing in your free time?|你空闲时喜欢做什么？","B|I enjoy hiking. Hong Kong has great trails.|我喜欢远足，香港的山径很棒。","A|Oh nice! Which trail do you like best?|不错！你最喜欢哪条？","B|Dragon's Back. The view is amazing.|龙脊，风景特别美。","A|I'm more into reading, but I'd like to try it.|我更喜欢阅读，不过我也想试试。","B|Let's go together sometime!|找个时间一起去吧！"],
k:"用“观点 + 原因 + 例子”介绍你最喜欢的两个爱好，每个 30 秒；用至少 3 种不同说法回答 What do you do in your free time?"});

D(15,{t:"现在正在做什么",e:"What Are You Doing Now?",
w:"now|现在;at the moment|此刻;currently|目前;busy|忙碌的;call|打电话;meeting|会议;prepare|准备;check|检查;reply|回复;wait|等待;write|写;read|读;look for|寻找;on the phone|在通话中;in a meeting|在开会",
s:["What are you doing?|你在做什么？","I'm preparing a report.|我在准备一份报告。","She's in a meeting at the moment.|她现在在开会。","He's on the phone right now.|他现在在通话。","I'm currently looking for a job in finance.|我目前在找金融方面的工作。","Can I call you back later?|我稍后回电给你好吗？"],
g:["现在进行时 be + doing","现在进行时表示此刻正在做，或近期一段时间在进行的事：I am working / She is talking / They are waiting。currently 常用于近期进行：I'm currently studying English.",["I'm working on the budget now.|我现在在做预算。","They are waiting in the lobby.|他们在大堂等候。","Are you listening?|你在听吗？"]],
c:["A|Hi, is Mr. Chan there?|你好，陈先生在吗？","B|Sorry, he's in a meeting at the moment.|抱歉，他现在在开会。","A|I see. When will he be free?|明白，他什么时候有空？","B|Around 3 o'clock. Can I take a message?|三点左右。需要我帮你留言吗？","A|Yes, please tell him Shello called.|好的，请告诉他 Shello 来过电话。","B|Sure. I'll let him know.|好的，我会转告他。"],
k:"看看周围或窗外，用现在进行时描述 10 件正在发生的事；模拟接电话替同事留言（谁打来、什么事、回电号码）。"});

D(16,{t:"昨天做了什么",e:"Yesterday (Regular Past)",
w:"yesterday|昨天;last week|上周;ago|…以前;worked|工作了;finished|完成了;called|打了电话;visited|拜访了;watched|看了;stayed|待了;studied|学习了;started|开始了;asked|问了;answered|回答了;talked|谈了;joined|加入了",
s:["I worked late yesterday.|我昨天加班到很晚。","I finished the report last night.|我昨晚完成了报告。","She called the client this morning.|她今天早上给客户打了电话。","We visited a bank last week.|我们上周拜访了一家银行。","I started learning English three days ago.|我三天前开始学英语。","Did you finish the task?|你完成任务了吗？"],
g:["一般过去时（规则动词）","规则动词加 -ed：work → worked，study → studied，stop → stopped。-ed 有三种读音：/t/（worked, asked），/d/（called, stayed），/ɪd/（started, visited）。否定和疑问用 did / didn't + 动词原形。",["I watched a movie last night.|我昨晚看了一部电影。","Did you call him? Yes, I did.|你给他打电话了吗？打了。","We didn't stay long.|我们没待多久。"]],
c:["A|You look tired. Did you work late yesterday?|你看起来很累，昨天加班了？","B|Yes, I stayed in the office until 10.|是的，我在办公室待到十点。","A|Did you finish the report?|报告做完了吗？","B|Almost. I just need to check the numbers.|差不多了，只需要核对一下数字。","A|Do you need any help?|需要帮忙吗？","B|Thanks, I'll ask you if I do.|谢谢，需要的话我会找你。"],
k:"用过去时讲“昨天我做了什么”，至少 10 个动作；把 worked / called / started 三类 -ed 读音各说 5 遍。"});

D(17,{t:"周末经历",e:"Weekend Stories (Irregular Past)",
w:"went|去了;had|吃了/有过;saw|看见了;met|遇见了;ate|吃了;bought|买了;took|乘坐了/拿了;made|做了;got|得到了;came|来了;did|做了;felt|感觉;spent|花费了;thought|认为;great|很棒的",
s:["How was your weekend?|你周末过得怎么样？","It was great, thanks.|很好，谢谢。","I went hiking with some friends.|我和朋友去远足了。","We had dim sum in Mong Kok.|我们在旺角吃了点心。","I met an old friend.|我见了一个老朋友。","I spent the whole day at home.|我一整天都待在家。"],
g:["一般过去时（不规则动词）","高频不规则过去式要整块记，不要现场推：go → went，have → had，see → saw，meet → met，eat → ate，buy → bought，take → took，make → made，get → got，come → came，do → did，feel → felt，spend → spent，think → thought，be → was / were。",["I went to Lantau Island.|我去了大屿山。","We saw a great movie.|我们看了一部很棒的电影。","I bought a new laptop.|我买了一台新笔记本电脑。"]],
c:["A|Hi Shello, how was your weekend?|嗨 Shello，周末过得怎么样？","B|It was great. I went to Lantau with my friends.|很好，我和朋友去了大屿山。","A|Nice! What did you do there?|不错！你们在那里做了什么？","B|We saw the Big Buddha and had lunch in Tai O.|我们看了天坛大佛，在大澳吃了午饭。","A|Sounds fun. Did you take any photos?|听起来很好玩，拍照了吗？","B|Lots! Let me show you.|拍了很多！给你看看。"],
k:"周一早上必聊话题：用 2 分钟讲你上个周末（什么时候、在哪里、和谁、做了什么、感受如何）。"});

D(18,{t:"计划与打算",e:"Plans & the Future",
w:"plan|计划;will|将会;going to|打算;next week|下周;soon|很快;later|稍后;tonight|今晚;future|将来;goal|目标;hope|希望;maybe|也许;probably|大概;decide|决定;apply|申请;interview|面试",
s:["What are you going to do this weekend?|你这个周末打算做什么？","I'm going to apply for a job at a bank.|我打算申请一家银行的工作。","I'll call you later.|我稍后打给你。","I'll probably stay at home.|我大概会待在家。","My goal is to speak fluent English.|我的目标是说一口流利的英语。","I hope to work in Hong Kong.|我希望在香港工作。"],
g:["will 与 be going to","be going to：已经想好的计划 / 打算（I'm going to study tonight）。will：说话时临时决定、承诺、预测（I'll help you. / It will rain.）。现在进行时也可以表示已经安排好的将来（I'm meeting a client tomorrow）。",["I'm going to take an English test next month.|我打算下个月考英语。","Don't worry, I'll send it today.|别担心，我今天就发。","I think the market will go up.|我认为市场会上涨。"]],
c:["A|Any plans for next week?|下周有什么计划？","B|Yes, I'm going to have a job interview on Tuesday.|有，我星期二有一个面试。","A|Wow, good luck! Which company?|哇，祝你好运！哪家公司？","B|It's an asset management firm in Central.|中环的一家资产管理公司。","A|I'm sure you'll do well.|我相信你会表现很好。","B|Thanks. I'll let you know how it goes.|谢谢，结果出来我告诉你。"],
k:"讲你的 90 天学习计划和 3 年职业目标，必须用上 going to / will / hope to / plan to，1 分半钟。"});

D(19,{t:"学会提问",e:"Asking Questions",
w:"what|什么;who|谁;where|哪里;when|什么时候;why|为什么;which|哪一个;how|怎样;how long|多久;how often|多常;whose|谁的;question|问题;answer|答案;mean|意思是;explain|解释;example|例子",
s:["What does this word mean?|这个词是什么意思？","How do you say this in English?|这个用英语怎么说？","Why did the price go down?|价格为什么下跌了？","Which department do you work in?|你在哪个部门工作？","How often do you check your email?|你多久查一次邮件？","Could you give me an example?|你能举个例子吗？"],
g:["特殊疑问句的语序","特殊疑问句 = 疑问词 + 助动词（do / does / did / be / can）+ 主语 + 动词？ 例：Where do you work? / What did he say? 问主语时不用助动词：Who called? 会提问，是让对话持续下去的关键能力。",["What do you think?|你怎么看？","Where did you study?|你在哪里读书？","Who is in charge of this project?|谁负责这个项目？"]],
c:["A|Can I ask you a few questions?|我可以问你几个问题吗？","B|Sure, go ahead.|当然，请问。","A|Which team are you in?|你在哪个团队？","B|I'm in the operations team.|我在运营团队。","A|When did you join the company?|你什么时候加入公司的？","B|About two years ago. Why do you ask?|大约两年前。你为什么问这个？"],
k:"围绕“工作”这个话题，用 10 个不同的疑问词连续提问，并自己回答每一个问题。"});

D(20,{t:"比较与选择",e:"Comparing Things",
w:"bigger|更大的;smaller|更小的;better|更好的;worse|更差的;more expensive|更贵的;cheaper|更便宜的;faster|更快的;busier|更忙的;the best|最好的;the most|最…的;than|比;compare|比较;difference|差别;similar|相似的;same|相同的",
s:["Hong Kong is smaller than Shenzhen.|香港比深圳小。","Rent in Hong Kong is more expensive.|香港的租金更贵。","The MTR is faster than the bus.|港铁比巴士快。","This is the best option for you.|这是最适合你的选择。","There's not much difference.|没什么差别。","Both are similar in price.|两者价格差不多。"],
g:["比较级与最高级","短形容词加 -er / -est（cheap → cheaper → the cheapest）；长形容词用 more / the most（more expensive → the most expensive）。不规则：good → better → best，bad → worse → worst。比较对象用 than 引出。",["This fund is riskier than that one.|这只基金比那只风险更高。","Central is the busiest area.|中环是最繁忙的地区。","Online banking is more convenient.|网上银行更方便。"]],
c:["A|Do you prefer Hong Kong or Shenzhen?|你更喜欢香港还是深圳？","B|That's a tough question. Shenzhen is bigger and cheaper.|这个问题很难回答。深圳更大也更便宜。","A|But Hong Kong is more international.|但香港更国际化。","B|True, and the salaries are higher here.|对，而且这里薪水更高。","A|Which city is better for finance?|哪个城市更适合做金融？","B|I think Hong Kong is the best for international finance.|我认为做国际金融，香港是最好的。"],
k:"比较香港和你的家乡（交通、房价、食物、工作机会），用至少 8 个比较级或最高级，1 分半钟。"});

D(22,{t:"办公室",e:"The Office",
w:"office|办公室;desk|办公桌;computer|电脑;printer|打印机;document|文件;file|档案;meeting room|会议室;pantry|茶水间;manager|经理;boss|老板;staff|员工;schedule|日程;deadline|截止日期;task|任务;urgent|紧急的",
s:["Please send me the document.|请把文件发给我。","Don't forget the deadline.|别忘了截止日期。","Let me print it for you.|我帮你打印出来。","The meeting room is booked.|会议室已经被订了。","This task is urgent.|这个任务很紧急。","Please check your schedule.|请看一下你的日程。"],
g:["祈使句","祈使句用动词原形开头，表示指示或请求（Send me the file.）。加 please 更礼貌；否定用 Don't…。Let me… 表示“让我来”，Let's… 表示“我们一起”。",["Please sign here.|请在这里签名。","Don't worry about it.|别担心。","Let's start the meeting.|我们开始开会吧。"]],
c:["A|Shello, could you come here for a second?|Shello，你能过来一下吗？","B|Sure. What's up?|好的，什么事？","A|Please print this document and put it in the meeting room.|请把这份文件打印出来放到会议室。","B|No problem. How many copies?|没问题，要几份？","A|Ten copies, please. And don't forget the deadline is today.|十份，谢谢。别忘了截止日期是今天。","B|Got it. I'll do it right away.|明白，我马上去办。"],
k:"扮演主管给新人布置 5 项任务（用祈使句），再扮演新人逐一确认（Got it / No problem / Sure, I'll…）。"});

D(23,{t:"职位与部门",e:"Jobs & Departments",
w:"department|部门;team|团队;analyst|分析师;director|总监;assistant|助理;accountant|会计;sales|销售;marketing|市场营销;operations|运营;human resources|人力资源;compliance|合规;risk management|风险管理;front office|前台业务部门;back office|后台部门;responsible for|负责",
s:["What do you do?|你是做什么的？","I work as an analyst.|我是一名分析师。","I work in the risk management department.|我在风险管理部工作。","I'm responsible for client accounts.|我负责客户账户。","She reports to the director.|她向总监汇报。","I work for an investment bank.|我在一家投资银行工作。"],
g:["介绍工作的四个介词","work as + 职位（as an analyst）；work in + 部门 / 行业（in compliance / in finance）；work for + 公司（for a bank）；work at + 地点 / 公司（at the head office）。be responsible for + 名词或 doing。",["I work as an accountant.|我是一名会计。","He works for a securities firm.|他在一家证券公司工作。","I'm responsible for preparing reports.|我负责准备报告。"]],
c:["A|So, what do you do?|你是做什么工作的？","B|I work as an operations assistant at a bank.|我在一家银行做运营助理。","A|Which department?|哪个部门？","B|Back office, in the settlement team.|后台，结算组。","A|What are you responsible for?|你负责什么？","B|I'm responsible for checking trades and payments.|我负责核对交易和付款。"],
k:"用 work as / in / for + be responsible for 介绍你现在或目标中的工作；再用英文说出一家金融公司的 5 个部门及其职能。"});

D(24,{t:"电话英语",e:"Phone Calls",
w:"speak to|和…通话;this is|我是(电话中);hold on|稍等;put through|转接;call back|回电;message|留言;extension|分机;line|线路;busy|占线的;available|有空的;leave a message|留言;speak up|大声点;repeat|重复;clearly|清楚地;voicemail|语音信箱",
s:["Hello, this is Shello from ABC Bank.|你好，我是 ABC 银行的 Shello。","May I speak to Mr. Wong, please?|请问王先生在吗？","Hold on, please. I'll put you through.|请稍等，我帮你转接。","I'm afraid he's not available right now.|恐怕他现在不方便接听。","Could you speak a little slower, please?|你能说慢一点吗？","Could I leave a message?|我可以留言吗？"],
g:["电话英语固定句型","电话中自报家门用 This is…（不说 I am…）；找人用 May I speak to…? / Is … there?；对方不在：I'm afraid he's not available。听不清时一定要请对方重复，这在职场是专业的表现，不是丢脸。",["Who's calling, please?|请问是哪位？","I'll call you back in ten minutes.|我十分钟后回电给你。","Sorry, the line is bad. Could you repeat that?|抱歉，线路不好，你能再说一遍吗？"]],
c:["A|Good morning, ABC Securities. How can I help you?|早上好，ABC 证券，有什么可以帮你？","B|Hi, this is Shello Wong. May I speak to Ms. Lee, please?|你好，我是 Shello Wong，请问李小姐在吗？","A|Hold on, please… I'm sorry, she's on another line.|请稍等……抱歉，她正在接另一个电话。","B|Could I leave a message?|我可以留言吗？","A|Of course.|当然。","B|Please ask her to call me back at 6123 4567. Thank you.|请她回电 6123 4567，谢谢。"],
k:"完整模拟 3 个电话：打电话找人、对方不在时留言、听不清时请对方重复或放慢。"});

D(25,{t:"约时间",e:"Making Appointments",
w:"appointment|预约;free|空闲的;arrange|安排;book|预订;confirm|确认;reschedule|改期;cancel|取消;suit|适合;convenient|方便的;instead|代替;look forward to|期待;calendar|日历;invite|邀请;works for me|对我来说可以;how about|…怎么样",
s:["Are you free on Thursday afternoon?|你星期四下午有空吗？","Would you like to meet for coffee?|要不要见面喝杯咖啡？","How about Friday at 10?|星期五十点怎么样？","Does 3 p.m. suit you?|下午三点合适吗？","I'm afraid I need to reschedule.|恐怕我需要改期。","I'll send you a calendar invite.|我会给你发日历邀请。"],
g:["提议与邀请","提议 / 邀请：Would you like to + 动词？ How about + 名词 / -ing？ Shall we…? Let's…。接受：That works for me / Sounds good。拒绝：I'm afraid I can't…，然后一定要给出替代方案。",["Would you like to join us for lunch?|要和我们一起吃午饭吗？","How about meeting next Monday?|下周一见面怎么样？","I look forward to seeing you.|期待见到你。"]],
c:["A|Hi Jason, I'd like to arrange a meeting to discuss the proposal.|嗨 Jason，我想约个会讨论一下方案。","B|Sure. When are you free?|好的，你什么时候有空？","A|How about Thursday at 2 p.m.?|星期四下午两点怎么样？","B|I'm afraid I have a call then. Does Friday morning suit you?|恐怕那时我有个电话会议。星期五上午可以吗？","A|Friday at 10 works for me.|星期五十点我可以。","B|Great. I'll send you a calendar invite.|好，我给你发日历邀请。"],
k:"模拟约 3 次会：顺利约定、对方提出改期、你需要取消并道歉，用上 suit / work for / reschedule。"});

D(26,{t:"礼貌请求",e:"Polite Requests",
w:"could|能(礼貌);would you mind|你介意…吗;help|帮助;favour|帮忙(英式拼法);possible|可能的;borrow|借入;lend|借出;send|发送;share|分享;take a look|看一看;when you have a moment|你有空时;appreciate|感激;of course|当然;no problem|没问题;bother|打扰",
s:["Could you help me with this?|你能帮我看看这个吗？","Would you mind explaining that again?|你介意再解释一遍吗？","Could you do me a favour?|你能帮我个忙吗？","Is it possible to get it by Friday?|有可能星期五前拿到吗？","Could you take a look when you have a moment?|你有空的时候能看一下吗？","I'd really appreciate it.|我会非常感激。"],
g:["礼貌请求的等级","礼貌程度：Can you…? < Could you…? < Would you mind + doing…? < I was wondering if you could…。注意：回答 Would you mind…? 时，表示“可以 / 不介意”要说 Not at all 或 Of course not。",["Would you mind closing the door?|你介意关一下门吗？","I was wondering if you could help me.|不知道你能不能帮我一下。","Could you send me the file?|你能把文件发给我吗？"]],
c:["A|Sorry to bother you, Amy. Could you do me a favour?|抱歉打扰你，Amy，你能帮我个忙吗？","B|Sure, what is it?|当然，什么事？","A|Would you mind checking my email before I send it?|你介意在我发出前帮我看一下邮件吗？","B|Not at all. Send it to me.|一点也不，发给我吧。","A|Thanks. I'd really appreciate it.|谢谢，非常感激。","B|No problem. I'll look at it in ten minutes.|没问题，我十分钟后看。"],
k:"把 10 个“直接命令”改成礼貌请求（例：Give me the report → Could you send me the report, please?），大声读出并录音。"});

D(27,{t:"金融数字",e:"Numbers in Finance",
w:"thousand|千;million|百万;billion|十亿;percent|百分之…;decimal point|小数点;half|一半;quarter|季度/四分之一;double|翻倍;total|总额;average|平均;increase|增加;decrease|减少;around|大约;exactly|准确地;figure|数字",
s:["Revenue was 3.5 billion dollars.|收入是 35 亿美元。","Profit increased by 12 percent.|利润增长了 12%。","The total is about 2.4 million.|总额大约 240 万。","Sales doubled in the second quarter.|第二季度销售额翻了一倍。","The interest rate is 4.25 percent.|利率是 4.25%。","That's roughly 50 thousand dollars.|大约是五万元。"],
g:["大数字、小数与百分比","英文数字三位一节：thousand（千）/ million（百万）/ billion（十亿）。中文“万”= ten thousand，“十万”= a hundred thousand，“亿”= a hundred million。小数读 point：4.25 = four point two five。百分比用 percent，变化幅度用 by：increased by 12%。",["ten thousand|10,000 = 一万","three hundred and fifty million|350,000,000 = 三亿五千万","zero point five percent|0.5% = 百分之零点五"]],
c:["A|How were the results this quarter?|这个季度业绩怎么样？","B|Pretty good. Revenue was 1.2 billion dollars.|很不错，收入 12 亿美元。","A|That's up from last quarter, right?|比上个季度高，对吧？","B|Yes, it increased by about 8 percent.|对，增长了约 8%。","A|And net profit?|净利润呢？","B|Around 230 million, roughly the same as last year.|大约 2.3 亿，和去年差不多。"],
k:"练读 20 个金融数字（例：HK$1,250,000、3.75%、2.8 billion、0.25 percentage points），每个读 3 遍；把“三万”“五十万”“两亿”“十五亿”说成英文。"});

D(29,{t:"面试自我介绍",e:"Interview Self-Introduction",
w:"background|背景;experience|经验;degree|学位;graduate|毕业;major|专业;skill|技能;strength|优势;motivated|有上进心的;hard-working|勤奋的;detail-oriented|注重细节的;opportunity|机会;position|职位;career|职业;because|因为;so|所以",
s:["Let me briefly introduce myself.|请允许我简单介绍一下自己。","I graduated with a degree in economics.|我毕业于经济学专业。","I have a strong background in finance.|我有扎实的金融背景。","I'm detail-oriented and hard-working.|我注重细节，工作勤奋。","I'm applying for this position because I want to grow my career in Hong Kong.|我申请这个职位，因为我想在香港发展事业。","My English is improving every day, so I'm confident I can communicate well.|我的英语每天都在进步，所以我有信心能沟通好。"],
g:["连接词 and / but / so / because","连接词让句子有逻辑：and（并列）/ but（转折）/ so（结果）/ because（原因）。面试自我介绍用“现在 → 过去 → 将来”结构：现在我是谁 → 过去的背景和经验 → 为什么申请这个职位。",["I'm new to Hong Kong, but I learn fast.|我刚来香港，但我学得很快。","I love numbers, so I chose finance.|我喜欢数字，所以选择了金融。","I want this job because it matches my skills.|我想要这份工作，因为它和我的技能匹配。"]],
c:["A|Could you tell me a little about yourself?|能简单介绍一下你自己吗？","B|Sure. My name is Shello Wong, and I'm from mainland China.|好的，我叫 Shello Wong，来自中国内地。","B|I have a background in finance, and I enjoy working with clients.|我有金融背景，也喜欢和客户打交道。","A|Why do you want to work in Hong Kong?|你为什么想在香港工作？","B|Because Hong Kong is an international financial centre, so it's the best place for my career.|因为香港是国际金融中心，所以它是我发展事业的最佳地方。","A|Great. Thank you.|很好，谢谢。"],
k:"写出并背熟 60 秒面试自我介绍（现在-过去-将来结构），录音至少 5 遍，最后一遍完全不看稿。这是第一阶段最重要的成果，请保存好录音。"});

</script>
<script>
/* 第二阶段 Day 31-60：职场进阶 —— 时态完善 · 商务沟通 · 金融基础 */
D(31,{t:"工作经历",e:"Work Experience",
w:"experience|经验;have worked|已经工作了;since|自从;for|持续(一段时间);ever|曾经;never|从未;already|已经;recently|最近;achieve|取得;handle|处理;manage|管理;client|客户;portfolio|投资组合;project|项目;responsibility|职责",
s:["I have worked in finance for five years.|我在金融行业工作了五年。","I've been in Hong Kong since March.|我从三月起就在香港了。","Have you ever worked with overseas clients?|你和海外客户合作过吗？","I've handled over 200 client accounts.|我处理过两百多个客户账户。","I've never used that system, but I learn quickly.|我没用过那个系统，但我学得很快。","I've recently completed a big project.|我最近完成了一个大项目。"],
g:["现在完成时 have / has + 过去分词","表示从过去开始一直持续到现在，或过去的经历对现在有影响。for + 时长（for five years），since + 起点（since 2020）。注意：句中出现具体的过去时间（last year / in 2020 / yesterday）时，要用一般过去时。",["She has worked here since 2019.|她从 2019 年起就在这里工作。","I've already sent the email.|我已经发了邮件。","Have you met our new director?|你见过我们的新总监吗？"]],
c:["A|How long have you worked in finance?|你在金融行业工作多久了？","B|I've worked in the industry for about six years.|我在这个行业大约六年了。","A|Have you ever worked with international clients?|你和国际客户合作过吗？","B|Yes, I have. I've handled clients from Singapore and the UK.|有，我服务过新加坡和英国的客户。","A|What's your biggest achievement so far?|你目前最大的成就是什么？","B|I've helped my team increase client assets by 20 percent.|我帮助团队把客户资产提升了 20%。"],

D(32,{t:"商务邮件",e:"Business Emails",
w:"subject|主题;regarding|关于;attach|附上;attachment|附件;follow up|跟进;reply|回复;forward|转发;cc|抄送;inform|通知;request|请求;kindly|烦请;at your earliest convenience|在你方便时尽早;best regards|此致敬礼;ASAP|尽快;revert|回复(港式常用)",
s:["I'm writing to follow up on our meeting yesterday.|我写信是想跟进昨天的会议。","Please find attached the report.|随附报告，请查收。","Could you please confirm by Friday?|可以请你在星期五前确认吗？","Please let me know if you have any questions.|如有任何问题请告诉我。","I'm copying my manager on this email.|这封邮件我抄送给了我的经理。","Looking forward to hearing from you.|期待你的回复。"],
g:["商务邮件的标准结构","称呼（Dear Mr. Chan / Hi Amy）→ 目的（I'm writing to…）→ 细节 → 行动请求（Could you…?）→ 结尾（Best regards）。香港职场常见 Please revert（请回复），看得懂即可；自己写建议用 Please reply / Please let me know。",["I'm writing regarding your account.|我写信是关于你的账户。","Thank you for your prompt reply.|感谢你的及时回复。","Sorry for the late reply.|抱歉回复晚了。"]],
c:["A|Did you get my email about the client report?|你收到我关于客户报告的邮件了吗？","B|Yes, thanks. But I couldn't find the attachment.|收到了，谢谢。但我没找到附件。","A|Oh, sorry! I'll resend it right away.|哦，抱歉！我马上重发。","B|No worries. Could you also cc Peter?|没关系，能顺便抄送给 Peter 吗？","A|Sure. Please reply by Friday if you have any comments.|好的，如有意见请在星期五前回复。","B|Will do. I'll follow up with you tomorrow.|好的，我明天跟进。"],
k:"先口头“说”出一封邮件（跟进会议、附上文件、请求周五前确认），再写下来，最后大声读 3 遍。"});

D(33,{t:"主持会议开场",e:"Opening a Meeting",
w:"agenda|议程;item|事项;purpose|目的;objective|目标;begin|开始;discuss|讨论;update|最新情况;minutes|会议纪要;attendee|出席者;move on|转到下一项;point|要点;summary|总结;action item|待办事项;wrap up|收尾;next steps|下一步",
s:["Shall we get started?|我们开始吧？","The purpose of today's meeting is to discuss the Q3 results.|今天会议的目的是讨论第三季度业绩。","Let's go through the agenda.|我们过一下议程。","Let's move on to the next item.|我们进入下一项。","Could you give us a quick update?|你能简单更新一下进展吗？","Let's wrap up with the action items.|最后我们确认一下待办事项。"],
g:["会议信号语","开场 Let's get started → 说明目的 The purpose of… is to… → 转换 Moving on to… → 邀请发言 Would you like to add anything? → 总结 To sum up… → 收尾 Let's wrap up。注意：discuss 后面直接接宾语，不加 about。",["Let's discuss the budget.|我们讨论一下预算。","Thanks, everyone, for coming.|谢谢大家出席。","Who will take the minutes?|谁来做会议纪要？"]],
c:["A|Good morning, everyone. Thanks for coming. Shall we get started?|大家早上好，谢谢出席。我们开始吧？","A|The purpose of today's meeting is to review our client numbers.|今天会议的目的是检视我们的客户数据。","B|Before we start, could we add one item to the agenda?|开始之前，可以在议程里加一项吗？","A|Sure, what is it?|当然，是什么？","B|The new compliance rules.|新的合规规定。","A|Good idea. Let's discuss that at the end.|好主意，我们最后讨论。"],
k:"主持一个 5 分钟的模拟会议开场：欢迎、说明目的、介绍 3 项议程、邀请第一位发言人。"});

D(34,{t:"发表观点",e:"Giving Opinions",
w:"opinion|观点;think|认为;believe|相信;view|看法;perspective|角度;feel|觉得;point of view|观点;suggest|建议;recommend|推荐;reason|理由;for example|例如;overall|总体而言;personally|就我个人而言;as far as I know|据我所知;main|主要的",
s:["In my opinion, we should focus on wealth management.|我认为我们应该专注于财富管理。","From my perspective, the risk is too high.|从我的角度看，风险太高了。","I believe this is a good opportunity.|我相信这是个好机会。","Personally, I'd prefer a safer option.|就我个人而言，我更倾向于稳妥的选择。","The main reason is that costs are rising.|主要原因是成本在上升。","For example, our competitor cut fees last month.|例如，我们的竞争对手上个月降低了费用。"],
g:["PREP 观点表达结构","Point（观点：I think…）→ Reason（原因：because…）→ Example（例子：for example…）→ Point（回到观点：so, overall…）。这是英文口语最实用的思维模板，几乎所有“你怎么看”的问题都能用。",["I think we should wait, because the market is volatile.|我认为应该等等，因为市场波动大。","As far as I know, the deadline is next week.|据我所知，截止日期是下周。","Overall, I'm positive about the plan.|总体而言，我看好这个计划。"]],
c:["A|What do you think about the new product?|你怎么看这个新产品？","B|In my opinion, it has great potential.|我认为它很有潜力。","A|Why do you think so?|为什么这么认为？","B|Because many clients are asking for low-risk products. For example, three clients asked me last week.|因为很多客户在找低风险产品。例如，上周就有三个客户问我。","A|Interesting point.|有意思的观点。","B|So overall, I think we should launch it soon.|所以总体来说，我认为应该尽快推出。"],
k:"用 PREP 结构就 3 个话题各说 1 分钟：远程办公好不好？AI 会取代金融工作吗？香港还是新加坡更适合金融职业？"});

D(36,{t:"同意与反对",e:"Agreeing & Disagreeing",
w:"agree|同意;disagree|不同意;exactly|完全正确;absolutely|绝对是;true|对的;however|然而;concern|顾虑;doubt|怀疑;on the other hand|另一方面;actually|其实;I see|我明白;fair|合理的;partly|部分地;alternative|替代方案;compromise|折中",
s:["I totally agree with you.|我完全同意你。","That's a good point.|这个观点很好。","I see what you mean, but I'm not sure.|我明白你的意思，但我不太确定。","I'm afraid I disagree.|恐怕我不同意。","I agree up to a point.|我在一定程度上同意。","Have we considered an alternative?|我们考虑过其他方案吗？"],
g:["先认可，再转折","英文职场表达反对，要先认可再转折：That's a fair point, but… / I see your point; however…。避免直接说 You're wrong 或单独一个 No。强烈同意：Absolutely / Exactly；部分同意：I agree up to a point。",["You're absolutely right.|你说得完全对。","I see your point, but the cost is too high.|我明白你的观点，但成本太高了。","I have some concerns about the timeline.|我对时间安排有些顾虑。"]],
c:["A|I think we should hire two more analysts.|我认为我们应该再招两个分析师。","B|I agree we need more people. But have we checked the budget?|我同意我们需要更多人手，但我们核对过预算吗？","A|That's a fair point. The budget is tight.|这一点有道理，预算确实紧。","B|Maybe we could hire one now and one next year?|也许可以现在招一个，明年再招一个？","A|That's a good compromise.|这是个好的折中方案。","B|Great, let's suggest that to the boss.|好，我们向老板提这个建议。"],
k:"给自己设定 5 个观点，分别用“强烈同意 / 部分同意 / 委婉反对”三种方式回应，每次都要说出理由。"});

D(37,{t:"建议与义务",e:"Advice & Obligation",
w:"should|应该;must|必须;have to|不得不;need to|需要;don't have to|不必;mustn't|禁止;advise|建议;rule|规定;policy|政策;requirement|要求;mandatory|强制的;optional|可选的;had better|最好;allowed|被允许的;training|培训",
s:["You should diversify your investments.|你应该分散投资。","All staff must complete the training.|所有员工必须完成培训。","I have to submit the report today.|我今天必须交报告。","You don't have to come to the office on Friday.|你星期五不必来办公室。","You mustn't share client data.|你绝对不能分享客户数据。","You'd better double-check the numbers.|你最好再核对一遍数字。"],
g:["should / must / have to / don't have to","should = 建议；must = 规定或说话人认为非常必要；have to = 外部要求；don't have to = 不必（注意不等于 mustn't！mustn't = 禁止）。金融合规场景大量使用 must / mustn't。",["Clients must provide proof of address.|客户必须提供住址证明。","You should talk to your manager.|你应该和你的经理谈谈。","We don't have to finish it today.|我们不必今天完成。"]],
c:["A|I'm new here. What should I know first?|我是新来的，首先应该了解什么？","B|Well, you must complete the compliance training this week.|嗯，你这周必须完成合规培训。","A|Do I have to do it in the office?|我必须在办公室完成吗？","B|No, you don't have to. You can do it online.|不必，你可以在线完成。","A|Any other advice?|还有其他建议吗？","B|You should never share client information outside the team.|永远不要在团队以外分享客户信息。"],
k:"给“新入职同事”提 8 条建议和规定，混合使用 should / must / have to / don't have to / mustn't。"});

D(38,{t:"可能性与推测",e:"Talking About Possibility",
w:"may|可能;might|也许;could|有可能;possibly|可能地;likely|很可能的;unlikely|不太可能的;certain|确定的;uncertain|不确定的;expect|预期;chance|可能性;risk|风险;depend on|取决于;outlook|前景;volatile|波动的;assume|假设",
s:["The market might go down next week.|市场下周可能会下跌。","Interest rates may stay high for longer.|利率可能会在更长时间内维持高位。","It could be a good opportunity.|这可能是个好机会。","It's likely that rates will come down next year.|明年利率很可能会下降。","It depends on the economic data.|这取决于经济数据。","I'm not certain, but I think so.|我不确定，但我认为是这样。"],
g:["推测的强度","will（确定）> is likely to（很可能）> may / might / could（有可能）> is unlikely to（不太可能）。金融行业说话要留余地，避免 100% 的断言，这既是专业，也是合规要求。",["Prices might rise further.|价格可能进一步上涨。","It's unlikely to change soon.|短期内不太可能改变。","That could be a problem.|那可能是个问题。"]],

k:"对 3 个金融或生活话题做预测，用不同强度的推测词表达，每个话题都必须用上 depend on。"});

D(39,{t:"描述趋势",e:"Describing Trends",
w:"rise|上升;fall|下降;increase|增加;decrease|减少;grow|增长;drop|下跌;recover|回升;peak|达到峰值;remain stable|保持稳定;fluctuate|波动;sharply|急剧地;slightly|略微地;steadily|稳定地;significantly|显著地;trend|趋势",

g:["趋势 = 动词 + 副词 / 形容词 + 名词","两种说法：rose sharply（动词 + 副词）= a sharp rise（形容词 + 名词）。数值变化：rise by 5%（变化幅度），rise to 25,000（到达水平），from… to…（从…到…）。",["Profit increased by 15% to 2 billion.|利润增长 15%，达到 20 亿。","There was a slight drop in demand.|需求略有下降。","The index fell from 20,000 to 18,500.|指数从两万跌到一万八千五。"]],

k:"描述一张“想象中的股价走势图”：开盘、上午、午后、收盘，用至少 6 个趋势动词和副词，1 分钟。"});

D(40,{t:"银行基础",e:"Banking Basics",
w:"account|账户;open an account|开户;deposit|存款;withdraw|取款;transfer|转账;balance|余额;interest|利息;loan|贷款;mortgage|按揭;savings account|储蓄账户;current account|往来账户;statement|结单;fee|费用;branch|分行;proof of address|住址证明",
s:["I'd like to open a savings account.|我想开一个储蓄账户。","The money is transferred within one working day.|款项在一个工作日内转出。","Interest is paid every month.|利息每月支付。","A fee is charged for overseas transfers.|海外转账会收取费用。","Your statement is sent by email.|你的结单会通过电邮发送。","What's the interest rate on this account?|这个账户的利率是多少？"],
g:["被动语态（一般现在时）","被动语态 = be + 过去分词，强调“事”而不是“谁做的”。银行和金融文件大量使用：Fees are charged… / Interest is calculated daily。主动：The bank charges a fee → 被动：A fee is charged。",["Your card is sent within 7 days.|你的卡会在 7 天内寄出。","Deposits are protected up to a certain limit.|存款在一定额度内受保障。","Documents are checked by our team.|文件由我们团队审核。"]],
c:["A|Good morning. I'd like to open an account.|早上好，我想开个账户。","B|Sure. Is it a savings account or a current account?|好的，是储蓄账户还是往来账户？","A|A savings account. What documents do I need?|储蓄账户。需要什么文件？","B|Your ID card or passport, and proof of address.|你的身份证或护照，以及住址证明。","A|Is there a monthly fee?|有月费吗？","B|No fee is charged if your balance is above 10,000 dollars.|如果余额在一万元以上就不收费。"],
k:"扮演银行职员，向客户介绍开户流程（所需文件、费用、利息、多久完成），至少用 3 个被动句。"});

D(41,{t:"市场基础",e:"Markets: Stocks & Bonds",
w:"stock|股票;share|股份;bond|债券;index|指数;investor|投资者;trading|交易;listed|上市的;stock exchange|证券交易所;market value|市值;dividend|股息;bull market|牛市;bear market|熊市;volume|成交量;price|价格;announce|宣布",
s:["The company was listed in Hong Kong in 2018.|这家公司 2018 年在香港上市。","Over 10 billion shares were traded today.|今天成交了超过一百亿股。","The dividend was announced last week.|股息上周公布了。","Bonds are considered safer than stocks.|债券被认为比股票更安全。","Investors were worried about interest rates.|投资者担心利率。","It's a bear market now.|现在是熊市。"],
g:["被动语态（一般过去时）","过去被动 = was / were + 过去分词。金融新闻高频：was listed（上市了）、was acquired（被收购）、were traded（被交易）、was announced（被公布）、was completed（完成了）。",["The deal was completed in March.|交易在三月完成。","The shares were sold at HK$20 each.|股票以每股 20 港元出售。","The results were released yesterday.|业绩昨天公布了。"]],
c:["A|Have you heard about the new IPO?|你听说那个新股上市了吗？","B|Yes, the company was listed on the Hong Kong Stock Exchange yesterday.|听说了，公司昨天在港交所上市。","A|How did it perform?|表现如何？","B|The shares were priced at HK$15 and closed at HK$18.|定价 15 港元，收市 18 港元。","A|That's a 20 percent gain!|涨了 20%！","B|Yes, but trading volume was quite low.|是的，但成交量偏低。"],
k:"用 1 分钟“播报”今日市场新闻：指数涨跌、成交量、一家公司上市或公布业绩，至少用 3 个过去被动句。"});

D(43,{t:"接待客户",e:"Meeting Clients",
w:"client|客户;customer|顾客;welcome|欢迎;serve|服务;introduce|介绍;relationship manager|客户经理;need|需求;contact|联系;satisfy|满足;trust|信任;loyal|忠诚的;VIP|贵宾;reception|接待处;look after|照顾/负责;have a seat|请坐",
s:["Welcome to our office. Please have a seat.|欢迎来到我们的办公室，请坐。","This is Ms. Lee, who is our senior relationship manager.|这位是李小姐，我们的高级客户经理。","We offer products that suit different needs.|我们提供适合不同需求的产品。","The client who called this morning wants a meeting.|今天早上打电话来的客户想约个会。","Can I get you something to drink?|给您来点喝的吗？","I'll follow up with you by email.|我会通过电邮跟进。"],
g:["定语从句 who / which / that","用 who（人）/ which（物）/ that（人或物）在名词后面补充说明。英文是“头轻脚重”：修饰语放在名词后面 —— the client who called me；中文正好相反：“给我打电话的客户”。这是中英思维最大的区别之一。",["The fund that I mentioned has low fees.|我提到的那只基金费用很低。","He's the manager who handles VIP clients.|他是负责贵宾客户的经理。","This is the report which you asked for.|这是你要的报告。"]],
c:["A|Good afternoon, Mr. Chen. Welcome to our office.|陈先生下午好，欢迎来到我们的办公室。","B|Thank you. Nice to meet you.|谢谢，很高兴见到你。","A|Can I get you a coffee or tea?|给您来杯咖啡还是茶？","B|A coffee, please.|咖啡，谢谢。","A|This is my colleague Jenny, who will look after your account.|这是我的同事 Jenny，她会负责您的账户。","B|Nice to meet you, Jenny.|很高兴认识你，Jenny。"],
k:"模拟接待一位 VIP 客户：问候、引座、递饮品、介绍同事（用 who 从句）、简短闲聊，3 分钟。"});

D(44,{t:"介绍金融产品",e:"Explaining Products",
w:"product|产品;feature|特点;benefit|好处;return|回报;risk level|风险等级;fixed deposit|定期存款;fund|基金;insurance|保险;flexible|灵活的;guaranteed|保证的;minimum|最低的;term|期限;suitable|合适的;charge|收费;option|选项",
s:["This product offers a guaranteed return of 3%.|这个产品提供 3% 的保证回报。","If you invest for 3 years, you'll get a higher rate.|如果你投资三年，就能获得更高的利率。","The minimum investment is 50,000 dollars.|最低投资额是五万元。","If you need cash, you can withdraw at any time.|如果你需要现金，可以随时取出。","It's suitable for clients with a low risk appetite.|它适合风险偏好低的客户。","Let me explain the main features.|让我解释一下主要特点。"],
g:["第一类条件句 If + 现在时, will + 动词","表示真实可能发生的情况：If + 一般现在时, will + 动词原形。If the market falls, the fund will lose value。介绍产品用“特点 → 好处”：It has…（特点），which means…（好处）。",["If you sign up today, we'll waive the fee.|如果你今天签约，我们会免除费用。","If rates go down, bond prices will go up.|如果利率下降，债券价格会上涨。","It's flexible, which means you can withdraw anytime.|它很灵活，这意味着你可以随时取款。"]],
c:["A|Could you tell me about this fixed deposit?|能介绍一下这个定期存款吗？","B|Sure. It offers 3.8% per year for a 12-month term.|当然，12 个月期，年利率 3.8%。","A|What if I need the money earlier?|如果我需要提前用钱呢？","B|If you withdraw early, you'll lose part of the interest.|如果提前支取，你会损失部分利息。","A|Is there a minimum amount?|有最低金额吗？","B|Yes, the minimum is 10,000 Hong Kong dollars.|有，最低一万港元。"],
k:"选一个金融产品（定期存款 / 基金 / 保险），按“特点 → 好处 → 风险 → 条件句”的结构介绍 2 分钟。"});

D(45,{t:"处理投诉",e:"Handling Complaints",
w:"complaint|投诉;complain|抱怨;apologize|道歉;mistake|错误;problem|问题;issue|事项/问题;solve|解决;investigate|调查;refund|退款;compensation|补偿;understand|理解;frustrated|沮丧的;immediately|立即;inconvenience|不便;resolve|解决",
s:["I'm really sorry for the inconvenience.|给您带来不便，非常抱歉。","I completely understand how you feel.|我完全理解您的感受。","Let me look into this for you right away.|我马上为您查一下。","I'm afraid there was a mistake on our side.|恐怕是我们这边出了错。","We'll refund the fee within 3 working days.|我们会在 3 个工作日内退还费用。","Is there anything else I can help you with?|还有什么我可以帮您的吗？"],
g:["投诉处理四步法","道歉（I'm sorry for…）→ 共情（I understand…）→ 行动（Let me…）→ 承诺时间（We'll… within…）。I'm afraid… 是委婉传达坏消息的万能开头。",["I'm afraid the system is down.|恐怕系统出故障了。","I apologize for the delay.|对延误我深表歉意。","We'll get back to you by tomorrow.|我们明天之前会回复您。"]],
c:["A|I was charged twice for the same transfer! This is unacceptable.|同一笔转账扣了我两次钱！这太不像话了。","B|I'm really sorry about that, Mr. Ho. I completely understand your frustration.|何先生，真的非常抱歉，我完全理解您的不满。","A|I want my money back.|我要拿回我的钱。","B|Of course. Let me check your account right away… Yes, I can see the double charge.|当然，我马上查一下您的账户……是的，我看到重复扣款了。","B|I'll arrange a refund now. It will be back in your account within 2 working days.|我现在就安排退款，2 个工作日内会退回您的账户。","A|OK. Thank you for handling it quickly.|好的，谢谢你处理得这么快。"],
k:"处理 3 个投诉（重复扣费、转账延迟、客户经理不回电），每个都严格按“道歉 → 共情 → 行动 → 承诺时间”四步走。"});

D(46,{t:"谈判",e:"Negotiation",
w:"negotiate|谈判;offer|报价/提议;deal|交易;terms|条款;budget|预算;flexible|灵活的;compromise|妥协;condition|条件;proposal|提案;agreement|协议;reasonable|合理的;lower|降低;accept|接受;counter-offer|还价;meet halfway|各让一步",
s:["What's the best price you can offer?|你们最优惠的价格是多少？","If we signed a two-year contract, would you lower the fee?|如果我们签两年合同，你们会降低费用吗？","That's a bit higher than our budget.|这比我们的预算高了一点。","I'm afraid we can't accept those terms.|恐怕我们不能接受这些条款。","Let's meet halfway.|我们各让一步吧。","I think we have a deal.|我想我们成交了。"],
g:["第二类条件句 If + 过去式, would + 动词","表示假设或委婉提议：If + 一般过去时, would + 动词原形。谈判中用来“试探性地提条件”，比直接要求委婉得多：If we ordered more, would you give us a discount? If I were you…（be 动词一律用 were）。",["If I were you, I'd accept the offer.|如果我是你，我会接受这个报价。","Would you consider a lower rate?|你们会考虑更低的费率吗？","If the price were lower, we would sign today.|如果价格再低一点，我们今天就签。"]],
c:["A|Your management fee is 1.5%. That's a bit high for us.|你们的管理费是 1.5%，对我们来说有点高。","B|It's in line with the market, but we can be flexible.|这和市场水平一致，不过我们可以灵活处理。","A|If we invested 50 million, would you reduce it to 1%?|如果我们投资五千万，你们能降到 1% 吗？","B|I'm afraid 1% is too low. How about 1.2%?|恐怕 1% 太低了，1.2% 怎么样？","A|Let's meet halfway at 1.1%.|我们各让一步，1.1%。","B|OK, I think we have a deal.|好，我想我们成交了。"],
k:"模拟一次费率谈判：开价 → 还价 → 条件交换（If…, would…?）→ 达成一致，双方角色各练一次。"});

D(47,{t:"进度汇报",e:"Deadlines & Progress",
w:"progress|进度;status|状态;on track|按计划进行;behind schedule|落后于计划;ahead of schedule|提前;complete|完成;almost|几乎;yet|还(未);already|已经;just|刚刚;delay|延误;extend|延长;priority|优先事项;draft|草稿;ETA|预计完成时间",
s:["We're on track to finish by Friday.|我们按计划会在星期五前完成。","I've already finished the first draft.|我已经完成了初稿。","I haven't received the data yet.|我还没收到数据。","I've just sent you the file.|我刚把文件发给你。","We're a bit behind schedule.|我们进度有点落后。","Could we extend the deadline to Monday?|我们能把截止日期延到星期一吗？"],
g:["already / yet / just 与现在完成进行时","already（肯定句，已经）、yet（否定句或疑问句句末，还 / 已经）、just（刚刚），常与现在完成时连用。现在完成进行时 have been doing 表示“一直在做”：I've been working on it all morning。",["Have you finished yet?|你完成了吗？","I've been checking the numbers since 9.|我从九点起一直在核对数字。","She's just joined the team.|她刚加入团队。"]],
c:["A|Hi Shello, what's the status of the client report?|嗨 Shello，客户报告进展如何？","B|I've already finished the first two sections.|我已经完成了前两部分。","A|Great. Is the data analysis done yet?|很好，数据分析完成了吗？","B|Not yet. I've been waiting for data from the risk team.|还没有，我一直在等风险团队的数据。","A|Will you still make the Friday deadline?|你还能赶上星期五的截止日期吗？","B|I think so. We're on track if I get the data today.|应该可以，如果今天拿到数据就能按计划完成。"],
k:"给主管做一次 30 秒进度汇报：已经完成什么、还没完成什么、遇到什么问题、预计何时完成。"});

D(48,{t:"团队协作",e:"Teamwork",
w:"teamwork|团队合作;cooperate|合作;support|支持;divide|分配;contribute|贡献;communicate|沟通;feedback|反馈;brainstorm|头脑风暴;rely on|依赖;help out|帮忙;workload|工作量;together|一起;suggest|建议;decide|决定;avoid|避免",
s:["I enjoy working in a team.|我喜欢团队合作。","Let's divide the tasks.|我们分一下工。","I'd like to help out if you need me.|如果你需要，我很乐意帮忙。","Thanks for your support.|谢谢你的支持。","Can I give you some feedback?|我可以给你一些反馈吗？","I'm happy to share my notes.|我很乐意分享我的笔记。"],
g:["动名词 doing 与不定式 to do","有些动词后接 -ing（enjoy, finish, mind, suggest, avoid, consider），有些接 to do（want, decide, plan, hope, agree, need）。suggest doing 和 decide to do 是最高频的易错点。",["I suggest meeting earlier.|我建议早点开会。","We decided to postpone the launch.|我们决定推迟发布。","Have you finished checking the data?|你核对完数据了吗？"]],
c:["A|We have a lot to do this week. Let's divide the tasks.|这周事情很多，我们分一下工吧。","B|Good idea. I can prepare the slides.|好主意，我来准备幻灯片。","A|Great. I'll finish checking the numbers.|好，我把数字核对完。","B|Do you mind sending them to me by Wednesday?|你介意星期三前发给我吗？","A|Not at all. And let me know if you need any help.|一点也不，需要帮忙随时告诉我。","B|Thanks. I really enjoy working with you.|谢谢，和你一起工作真的很愉快。"],
k:"讲一次你和团队合作成功的经历（背景 → 你的角色 → 做了什么 → 结果），至少用 4 个 doing / to do 结构。"});

D(50,{t:"演讲开场",e:"Presentations: Opening",
w:"presentation|演讲/展示;topic|主题;outline|大纲;first|首先;second|其次;next|接下来;then|然后;finally|最后;slide|幻灯片;conclude|总结;in summary|总之;overview|概述;key point|要点;divided into|分为;feel free to|随时可以",
s:["Good morning, everyone. Today I'm going to talk about our Q3 results.|大家早上好，今天我要讲第三季度业绩。","My presentation is divided into three parts.|我的演讲分为三部分。","First, I'll give you an overview of the market.|首先，我会概述一下市场情况。","Next, let's look at our performance.|接下来，我们看看我们的表现。","Finally, I'll share some recommendations.|最后，我会分享一些建议。","Please feel free to ask questions at the end.|最后欢迎大家随时提问。"],
g:["演讲信号词","信号词让听众跟得上：开场 Today I'm going to… → 结构 It's divided into three parts → 过渡 Let's move on to… → 总结 To sum up…。英文演讲的经典原则：先告诉听众你要讲什么 → 讲 → 再告诉他们你讲了什么。",["Let's move on to the next slide.|我们看下一张幻灯片。","As you can see from this chart…|从这张图表可以看到……","To sum up, there are three key points.|总结一下，有三个要点。"]],
c:["A|Good afternoon, everyone. Thanks for being here.|大家下午好，谢谢各位到场。","A|Today I'm going to talk about our Q3 wealth management results.|今天我要讲第三季度的财富管理业绩。","A|My presentation has three parts.|我的演讲有三部分。","A|First, the overall numbers. Second, our top products. And finally, our plans for Q4.|第一，整体数据；第二，我们的主打产品；最后，第四季度计划。","B|Will there be time for questions?|会有提问时间吗？","A|Yes, please feel free to ask at the end.|有的，最后欢迎随时提问。"],
k:"准备并录制一个 1 分钟演讲开场（自我介绍 + 主题 + 三部分结构），题目自选。"});

D(51,{t:"讲解数据",e:"Presenting Data",
w:"chart|图表;graph|曲线图;table|表格;data|数据;bar|柱;axis|坐标轴;represent|代表;show|显示;illustrate|说明;compared with|与…相比;year-on-year|同比;quarter-on-quarter|环比;account for|占(比例);highlight|突出;suggest|表明",
s:["As you can see from this chart, revenue has grown.|从这张图表可以看到，收入增长了。","This line represents our market share.|这条线代表我们的市场份额。","Wealth management accounts for 40% of our income.|财富管理占我们收入的 40%。","Compared with last year, profit is up 15%.|与去年相比，利润增长了 15%。","Year-on-year, client numbers increased by 8%.|客户数量同比增长 8%。","I'd like to highlight one key figure.|我想强调一个关键数字。"],
g:["描述数据三步法","指出图表（This chart shows…）→ 说明趋势（rose steadily…）→ 解读含义（This means… / This suggests…）。account for 表示“占比”：Asia accounts for half of our sales。",["The blue bar shows our revenue.|蓝色柱代表我们的收入。","This suggests strong demand from clients.|这表明客户需求强劲。","Asia accounts for over half of our sales.|亚洲占我们销售额的一半以上。"]],
c:["A|Let's look at this chart. It shows our revenue over the last four quarters.|我们来看这张图表，它显示了过去四个季度的收入。","A|As you can see, revenue rose steadily from Q1 to Q3.|可以看到，收入从第一季度到第三季度稳步上升。","B|What happened in Q4?|第四季度发生了什么？","A|Good question. It dropped slightly because of market volatility.|好问题，由于市场波动，收入略有下降。","B|Which business is the biggest?|哪项业务最大？","A|Wealth management. It accounts for about 45% of total revenue.|财富管理，约占总收入的 45%。"],
k:"想象一张收入柱状图，用“指出 → 趋势 → 解读”讲解 1 分钟，至少用上 compared with / account for / year-on-year。"});

D(52,{t:"问答环节",e:"Handling Q&A",
w:"clarify|澄清;rephrase|换种说法;detail|细节;specific|具体的;figure out|弄清楚;get back to|回复;mention|提到;regarding|关于;information|信息;check|核实;good question|好问题;follow-up|后续的;understand|理解;wonder|想知道;release|发布",
s:["That's a great question.|这是个很好的问题。","Could you tell me what you mean by risk-adjusted?|你能告诉我“风险调整后”是什么意思吗？","Do you know when the results will be released?|你知道业绩什么时候公布吗？","Let me make sure I understand your question.|让我确认一下我理解了你的问题。","I'm not sure about that, but I'll get back to you.|这个我不确定，但我会回复你。","Does that answer your question?|这回答了你的问题吗？"],
g:["间接疑问句：陈述语序","间接疑问句更礼貌：Could you tell me + 疑问词 + 主语 + 动词？（用陈述语序！）直接：What time is it? → 间接：Could you tell me what time it is? 不知道答案时：I'll check and get back to you。",["Do you know where the meeting room is?|你知道会议室在哪里吗？","Could you explain how this works?|你能解释一下这是怎么运作的吗？","I wonder why the price changed.|我想知道价格为什么变了。"]],
c:["A|Thank you. Are there any questions?|谢谢，有什么问题吗？","B|Yes. Could you tell me why the costs went up in Q4?|有，你能说说第四季度成本为什么上升吗？","A|That's a great question. It was mainly due to new IT systems.|好问题，主要是因为新的 IT 系统。","B|Do you know if costs will stay high next year?|你知道明年成本会不会继续偏高吗？","A|I'm not sure yet, but I'll check with finance and get back to you.|还不确定，我会和财务部确认后回复你。","B|Thanks, that's helpful.|谢谢，很有帮助。"],
k:"把 10 个直接疑问句改成间接疑问句；模拟演讲 Q&A，回答 3 个问题，其中 1 个你“不知道”，要得体处理。"});

D(53,{t:"商务社交",e:"Networking",
w:"networking|社交拓展;event|活动;business card|名片;industry|行业;connect|建立联系;keep in touch|保持联系;small talk|闲聊;firm|公司;background|背景;mutual friend|共同朋友;catch up|叙旧;reach out|主动联系;speaker|演讲者;line of work|行业/职业;bring|带来",
s:["Hi, I don't think we've met. I'm Shello.|你好，我们好像没见过，我是 Shello。","What brings you here tonight?|今晚是什么让你来到这里？","It's a great event, isn't it?|活动很棒，是吧？","What line of work are you in?|你从事哪一行？","Here's my card. Let's keep in touch.|这是我的名片，保持联系。","I'll connect with you on LinkedIn.|我会在领英上加你。"],

c:["A|Hi, I don't think we've met. I'm Shello from ABC Wealth.|你好，我们好像没见过，我是 ABC 财富的 Shello。","B|Hi Shello, I'm David. I work in private banking.|你好 Shello，我是 David，做私人银行。","A|Nice to meet you. Great event, isn't it?|很高兴认识你。活动很棒，是吧？","B|Yes, the speakers were really good. What brings you here?|是啊，演讲嘉宾很好。你怎么会来？","A|I'm new to Hong Kong, so I'm trying to meet people in the industry.|我刚来香港，想多认识业内的人。","B|Great. Here's my card. Let's keep in touch.|太好了，这是我的名片，保持联系。"],
